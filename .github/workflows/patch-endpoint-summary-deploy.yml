name: "TEMP | Patch endpoint summary deployment"

on:
  push:
    branches:
      - feature/endpoint-credential-foundation
    paths:
      - ".github/workflows/patch-endpoint-summary-deploy.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/endpoint-credential-foundation
          fetch-depth: 0

      - name: Patch runtime helper and TEST68
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('deploy/j129/avaya-j129-lab-deploy')
          text = helper.read_text(encoding='utf-8')

          replacements = [
              (
                  '    "$workspace/var/www/html/modules/endpoint_configurator/index.php" \\\n    "$workspace/var/www/html/modules/endpoint_configurator/themes/default/reporte_endpoints.tpl" \\\n    "$workspace/var/www/html/modules/endpoint_configurator/themes/default/js/javascript.js"; do',
                  '    "$workspace/var/www/html/modules/endpoint_configurator/index.php" \\\n    "$workspace/var/www/html/modules/endpoint_configurator/dialogs/summary/index.php" \\\n    "$workspace/var/www/html/modules/endpoint_configurator/dialogs/summary/lang/en.lang" \\\n    "$workspace/var/www/html/modules/endpoint_configurator/themes/default/reporte_endpoints.tpl" \\\n    "$workspace/var/www/html/modules/endpoint_configurator/themes/default/js/javascript.js"; do'
              ),
              (
                  '  php -l "$workspace/var/www/html/modules/endpoint_configurator/index.php" >/dev/null\n  bash -n "$workspace/deploy/endpoint-configurator/bin/install-key.sh"',
                  '  php -l "$workspace/var/www/html/modules/endpoint_configurator/index.php" >/dev/null\n  php -l "$workspace/var/www/html/modules/endpoint_configurator/dialogs/summary/index.php" >/dev/null\n  bash -n "$workspace/deploy/endpoint-configurator/bin/install-key.sh"'
              ),
              (
                  '      "$ENDPOINT_CREDENTIAL_MODULE/index.php" \\\n      "$ENDPOINT_CREDENTIAL_MODULE/libs/EndpointCredentialVault.class.php" \\\n      "$ENDPOINT_CREDENTIAL_MODULE/themes/default/reporte_endpoints.tpl"',
                  '      "$ENDPOINT_CREDENTIAL_MODULE/index.php" \\\n      "$ENDPOINT_CREDENTIAL_MODULE/libs/EndpointCredentialVault.class.php" \\\n      "$ENDPOINT_CREDENTIAL_MODULE/dialogs/summary/index.php" \\\n      "$ENDPOINT_CREDENTIAL_MODULE/dialogs/summary/lang/en.lang" \\\n      "$ENDPOINT_CREDENTIAL_MODULE/themes/default/reporte_endpoints.tpl"'
              ),
              (
                  '  install -d -o root -g root -m 0755 "$ENDPOINT_CREDENTIAL_MODULE/libs"\n  install -d -o root -g root -m 0755 /usr/local/libexec',
                  '  install -d -o root -g root -m 0755 "$ENDPOINT_CREDENTIAL_MODULE/libs"\n  install -d -o root -g root -m 0755 "$ENDPOINT_CREDENTIAL_MODULE/dialogs/summary/lang"\n  install -d -o root -g root -m 0755 /usr/local/libexec'
              ),
              (
                  '$workspace/var/www/html/modules/endpoint_configurator/index.php $ENDPOINT_CREDENTIAL_MODULE/index.php\nEOF\n\n  install -o root -g root -m 0644 "$workspace/var/www/html/modules/endpoint_configurator/themes/default/reporte_endpoints.tpl"',
                  '$workspace/var/www/html/modules/endpoint_configurator/index.php $ENDPOINT_CREDENTIAL_MODULE/index.php\n$workspace/var/www/html/modules/endpoint_configurator/dialogs/summary/index.php $ENDPOINT_CREDENTIAL_MODULE/dialogs/summary/index.php\n$workspace/var/www/html/modules/endpoint_configurator/dialogs/summary/lang/en.lang $ENDPOINT_CREDENTIAL_MODULE/dialogs/summary/lang/en.lang\nEOF\n\n  install -o root -g root -m 0644 "$workspace/var/www/html/modules/endpoint_configurator/themes/default/reporte_endpoints.tpl"'
              ),
              (
                  '      "$ENDPOINT_CREDENTIAL_MODULE/index.php"|\\\n      "$ENDPOINT_CREDENTIAL_MODULE/libs/EndpointCredentialVault.class.php"|\\\n      "$ENDPOINT_CREDENTIAL_MODULE/themes/default/reporte_endpoints.tpl"|\\',
                  '      "$ENDPOINT_CREDENTIAL_MODULE/index.php"|\\\n      "$ENDPOINT_CREDENTIAL_MODULE/libs/EndpointCredentialVault.class.php"|\\\n      "$ENDPOINT_CREDENTIAL_MODULE/dialogs/summary/index.php"|\\\n      "$ENDPOINT_CREDENTIAL_MODULE/dialogs/summary/lang/en.lang"|\\\n      "$ENDPOINT_CREDENTIAL_MODULE/themes/default/reporte_endpoints.tpl"|\\'
              ),
              (
                  '  cmp -s "$workspace/var/www/html/modules/endpoint_configurator/index.php" "$ENDPOINT_CREDENTIAL_MODULE/index.php"\n  cmp -s "$workspace/var/www/html/modules/endpoint_configurator/themes/default/reporte_endpoints.tpl"',
                  '  cmp -s "$workspace/var/www/html/modules/endpoint_configurator/index.php" "$ENDPOINT_CREDENTIAL_MODULE/index.php"\n  cmp -s "$workspace/var/www/html/modules/endpoint_configurator/dialogs/summary/index.php" "$ENDPOINT_CREDENTIAL_MODULE/dialogs/summary/index.php"\n  cmp -s "$workspace/var/www/html/modules/endpoint_configurator/dialogs/summary/lang/en.lang" "$ENDPOINT_CREDENTIAL_MODULE/dialogs/summary/lang/en.lang"\n  cmp -s "$workspace/var/www/html/modules/endpoint_configurator/themes/default/reporte_endpoints.tpl"'
              ),
              (
                  '  php -l "$ENDPOINT_CREDENTIAL_MODULE/index.php" >/dev/null\n  php -l "$ENDPOINT_CREDENTIAL_MODULE/libs/EndpointCredentialVault.class.php" >/dev/null',
                  '  php -l "$ENDPOINT_CREDENTIAL_MODULE/index.php" >/dev/null\n  php -l "$ENDPOINT_CREDENTIAL_MODULE/dialogs/summary/index.php" >/dev/null\n  php -l "$ENDPOINT_CREDENTIAL_MODULE/libs/EndpointCredentialVault.class.php" >/dev/null'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'helper patch anchor count={count}: {old[:90]!r}')
              text = text.replace(old, new, 1)
          helper.write_text(text, encoding='utf-8')

          wf = Path('.github/workflows/lab-endpoint-credential-test68.yml')
          w = wf.read_text(encoding='utf-8')
          old = '      - "tests/audit/test_endpoint_credential_foundation.py"'
          new = old + '\n      - "tests/audit/test_endpoint_main_account_status.py"'
          if w.count(old) != 1:
              raise SystemExit('TEST68 path anchor mismatch')
          w = w.replace(old, new, 1)

          old = '          python3 -m unittest tests.audit.test_endpoint_credential_foundation -v\n          bash -n deploy/j129/avaya-j129-lab-deploy'
          new = '          python3 -m unittest tests.audit.test_endpoint_credential_foundation tests.audit.test_endpoint_main_account_status -v\n          php -l var/www/html/modules/endpoint_configurator/dialogs/summary/index.php\n          bash -n deploy/j129/avaya-j129-lab-deploy'
          if w.count(old) != 1:
              raise SystemExit('TEST68 audit anchor mismatch')
          w = w.replace(old, new, 1)
          wf.write_text(w, encoding='utf-8')
          PY

          python3 -m unittest tests.audit.test_endpoint_credential_foundation tests.audit.test_endpoint_main_account_status -v
          php -l var/www/html/modules/endpoint_configurator/dialogs/summary/index.php
          bash -n deploy/j129/avaya-j129-lab-deploy
          git diff --check

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-endpoint-summary-deploy.yml
          git add deploy/j129/avaya-j129-lab-deploy .github/workflows/lab-endpoint-credential-test68.yml
          git commit -m "fix(endpoint): deploy account registration summary"
          git push origin HEAD:feature/endpoint-credential-foundation
