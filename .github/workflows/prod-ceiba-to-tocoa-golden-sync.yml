name: 78 | Ceiba -> Tocoa | Endpoint Golden State Sync

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/prod-ceiba-to-tocoa-golden-sync.yml'
      - 'deploy/endpoint-configurator/bin/grandstream-prod-deploy'
      - 'deploy/endpoint-configurator/bin/issabel-prod-helper-sync'
      - 'deploy/endpoint-configurator/bin/tocoa-ceiba-golden-sync'
      - 'deploy/endpoint-configurator/sudoers/tocoa-ceiba-golden-sync'
      - 'var/www/html/modules/endpoint_configurator/libs/paloEndpointScanStatus.class.php'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escriba CLONE-CEIBA-GOLDEN-TO-TOCOA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ceiba-to-tocoa-endpoint-golden-sync
  cancel-in-progress: false

jobs:
  static-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate guarded sync
        shell: bash
        run: |
          set -euo pipefail
          h='deploy/endpoint-configurator/bin/tocoa-ceiba-golden-sync'
          s='deploy/endpoint-configurator/sudoers/tocoa-ceiba-golden-sync'
          prod='deploy/endpoint-configurator/bin/grandstream-prod-deploy'
          sync='deploy/endpoint-configurator/bin/issabel-prod-helper-sync'
          bash -n "$h" "$prod" "$sync"
          grep -Fq 'GOLDEN_EXPORT_REQUEST=' "$prod"
          grep -Fq 'CEIBA-GOLDEN-EXPORT-VIA-PERMANENT-HELPER=PASS' "$prod"
          grep -Fq "RUNNER_USER='github-runner-prod'" "$sync"
          grep -Fq "EXPECTED_HOST='toc-pbx01'" "$h"
          grep -Fq 'CATALOG-DML-IMPORT-PASS' "$h"
          grep -Fq 'ENDPOINT-NATURAL-KEY-REMAP-PASS' "$h"
          grep -Fq 'CEIBA-CATALOG-PORTABLE-VERIFY-PASS' "$h"
          scan='var/www/html/modules/endpoint_configurator/libs/paloEndpointScanStatus.class.php'
          php -l "$scan" >/dev/null
          grep -Fq "\$cuentasRegistradas[\$ip]['sip'][] = \$extArray[0];" "$scan"
          grep -Fq "\$cuentasRegistradas[\$ip]['iax2'][] = \$l[0];" "$scan"
          grep -Fq "\$cuentasRegistradas[\$ip]['pjsip'][] = \$matches[1];" "$scan"
          ! grep -Fq "\$cuentasRegistradas['sip'][\$extArray[0]] = \$ip;" "$scan"
          grep -Fq "awk '/^INSERT INTO / { print }'" "$prod"
          ! grep -Fq 'CREATE TEMPORARY TABLE' "$h"
          ! grep -Fq 'DROP TEMPORARY TABLE' "$h"
          grep -Fq "source_host=cei-pbx02" "$h"
          grep -Fq "TOCOA-CEIBA-GOLDEN-SYNC=PASS" "$h"
          grep -Fq "phone_write=NO" "$h"
          grep -Fq "endpoint_discovery=NO" "$h"
          grep -Fq "service_restart=NO" "$h"
          grep -Fq 'github-runner-tocoa ALL=(root) NOPASSWD: TOCOA_CEIBA_GOLDEN_SYNC' "$s"
          ! grep -Eq 'sip notify|config_update|dologin|reboot|issabel-endpointconfig[[:space:]]+--applyconfig' "$h"
          echo 'CEIBA-TO-TOCOA-STATIC-SAFETY=PASS'

  export-ceiba:
    name: Export portable golden state from Ceiba
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: static-safety
    runs-on: [self-hosted, Linux, X64, j129-production, cei-pbx02]
    timeout-minutes: 20
    steps:
      - name: Guard Ceiba source
        env:
          CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'main'
          test "$CONFIRM" = 'CLONE-CEIBA-GOLDEN-TO-TOCOA'
          test "$(hostname -s)" = 'cei-pbx02'
          test "$(id -un)" = 'github-runner-prod'
          echo 'source=cei-pbx02'
          echo 'source_runtime_write=NO'
          echo 'source_db_write=NO'
          echo 'phone_write=NO'
          echo 'CEIBA-GOLDEN-EXPORT-GUARD=PASS'

      - name: Checkout reviewed main candidate for permanent synchronizer
        uses: actions/checkout@v4
        with:
          ref: main
          path: _prod_helper_candidate
          clean: true
          persist-credentials: false
          fetch-depth: 1

      - name: Sync reviewed permanent helper payload
        shell: bash
        run: |
          set -euo pipefail
          PROD_SYNC='/usr/local/sbin/issabel-prod-helper-sync'
          test -x "$PROD_SYNC"
          sudo -n -l "$PROD_SYNC" >/dev/null
          sudo -n "$PROD_SYNC" | tee "$RUNNER_TEMP/ceiba-helper-sync.txt"
          grep -Fq 'PROD-HELPER-SYNC-GRANDSTREAM=PASS' "$RUNNER_TEMP/ceiba-helper-sync.txt"
          grep -Fq 'phone_write=NO' "$RUNNER_TEMP/ceiba-helper-sync.txt"
          echo 'CEIBA-PERMANENT-HELPER-SYNC=PASS'

      - name: Request golden export through synchronized helper
        shell: bash
        run: |
          set -euo pipefail
          request="$GITHUB_WORKSPACE/_ceiba_golden_export_request"
          bundle="$GITHUB_WORKSPACE/_ceiba_golden_bundle"
          rm -rf "$bundle"
          printf '%s' 'EXPORT-CEIBA-ENDPOINT-GOLDEN' > "$request"
          chmod 600 "$request"
          test "$(stat -c '%U' "$request")" = 'github-runner-prod'

          sudo -n /usr/local/sbin/issabel-grandstream-prod verify | tee "$RUNNER_TEMP/ceiba-golden-export.txt"

          grep -Fq 'CEIBA-GOLDEN-EXPORT-VIA-PERMANENT-HELPER=PASS' "$RUNNER_TEMP/ceiba-golden-export.txt"
          test -r "$bundle/runtime.tar.gz"
          test -r "$bundle/catalog.sql"
          test -r "$bundle/catalog.sha256"
          test -r "$bundle/catalog.semantic.sha256"
          test -r "$bundle/runtime.manifest"
          test -r "$bundle/meta.env"

          # Ceiba itself contains a legacy account-reconciliation indexing bug
          # that is masked by its pre-existing endpoint_account rows. Carry the
          # reviewed portable fix separately so a fresh PBX can create those rows.
          portable="$bundle/portable"
          mkdir -p "$portable"
          fixed="_prod_helper_candidate/var/www/html/modules/endpoint_configurator/libs/paloEndpointScanStatus.class.php"
          php -l "$fixed" >/dev/null
          grep -Fq "\$cuentasRegistradas[\$ip]['sip'][] = \$extArray[0];" "$fixed"
          grep -Fq "\$cuentasRegistradas[\$ip]['iax2'][] = \$l[0];" "$fixed"
          grep -Fq "\$cuentasRegistradas[\$ip]['pjsip'][] = \$matches[1];" "$fixed"
          cp "$fixed" "$portable/paloEndpointScanStatus.class.php"
          ( cd "$portable" && sha256sum paloEndpointScanStatus.class.php > portable.sha256 )
          echo 'portable_account_reconcile=YES' >> "$bundle/meta.env"

          echo "BUNDLE=$bundle" >> "$GITHUB_ENV"
          echo 'CEIBA-GOLDEN-PORTABLE-EXPORT=PASS'
          echo 'PORTABLE-ACCOUNT-RECONCILE-PAYLOAD=PASS'

      - name: Upload Ceiba golden bundle
        uses: actions/upload-artifact@v4
        with:
          name: ceiba-golden-portable
          path: ${{ env.BUNDLE }}/*
          if-no-files-found: error
          retention-days: 7

  apply-tocoa:
    name: Apply exact Ceiba golden state to Tocoa
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: export-ceiba
    runs-on: [self-hosted, Linux, X64, tocoa, toc-pbx01]
    timeout-minutes: 25
    steps:
      - name: Guard Tocoa target
        env:
          CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'main'
          test "$CONFIRM" = 'CLONE-CEIBA-GOLDEN-TO-TOCOA'
          test "$(hostname -s)" = 'toc-pbx01'
          test "$(id -un)" = 'github-runner-tocoa'
          echo 'target=toc-pbx01'
          echo 'phone_write=NO'
          echo 'endpoint_discovery=NO'
          echo 'TOCOA-GOLDEN-APPLY-GUARD=PASS'

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true
          persist-credentials: false

      - name: Verify installed root helper
        shell: bash
        run: |
          set -euo pipefail
          live='/usr/local/sbin/tocoa-ceiba-golden-sync'
          src='deploy/endpoint-configurator/bin/tocoa-ceiba-golden-sync'
          test -x "$live"
          test "$(sha256sum "$live" | awk '{print $1}')" = "$(sha256sum "$src" | awk '{print $1}')"
          sudo -n -l | grep -Fq '/usr/local/sbin/tocoa-ceiba-golden-sync apply APPLY-CEIBA-GOLDEN-TO-TOCOA'
          echo 'TOCOA-GOLDEN-HELPER-PARITY=PASS'

      - name: Prepare fixed bundle path
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _ceiba_golden_bundle
          mkdir -p _ceiba_golden_bundle

      - name: Download Ceiba golden bundle
        uses: actions/download-artifact@v4
        with:
          name: ceiba-golden-portable
          path: _ceiba_golden_bundle

      - name: Apply Ceiba golden state
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/tocoa-ceiba-golden-sync             apply APPLY-CEIBA-GOLDEN-TO-TOCOA | tee "$RUNNER_TEMP/tocoa-ceiba-golden-sync.txt"
          grep -Fq 'CEIBA-RUNTIME-SHA-PARITY-PASS' "$RUNNER_TEMP/tocoa-ceiba-golden-sync.txt"
          grep -Fq 'PORTABLE-ACCOUNT-RECONCILE-PASS' "$RUNNER_TEMP/tocoa-ceiba-golden-sync.txt"
          grep -Fq 'CEIBA-CATALOG-PORTABLE-VERIFY-PASS' "$RUNNER_TEMP/tocoa-ceiba-golden-sync.txt"
          grep -Fq 'TOCOA-CEIBA-GOLDEN-SYNC=PASS' "$RUNNER_TEMP/tocoa-ceiba-golden-sync.txt"

      - name: Read-only post-sync audit
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/tocoa-endpoint-prod-audit | tee "$RUNNER_TEMP/tocoa-post-golden-audit.txt"
          grep -Fq 'TOCOA-ENDPOINT-PROD-READONLY-AUDIT=PASS' "$RUNNER_TEMP/tocoa-post-golden-audit.txt"

      - name: Summary
        shell: bash
        run: |
          {
            echo '# Ceiba -> Tocoa Endpoint Golden State'
            echo
            echo '- Runtime copied from live Ceiba: PASS'
            echo '- Portable account reconciliation fix applied: PASS'
            echo '- Full manufacturer/model/OUI/property catalog parity: PASS'
            echo '- Tocoa endpoints/accounts preserved by natural-key remap'
            echo '- Phone writes: NO'
            echo '- Discovery executed automatically: NO'
            echo
            grep '^ENDPOINT ' "$RUNNER_TEMP/tocoa-post-golden-audit.txt" | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tocoa-after-ceiba-golden-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tocoa-ceiba-golden-sync.txt
            ${{ runner.temp }}/tocoa-post-golden-audit.txt
          if-no-files-found: ignore
          retention-days: 30
