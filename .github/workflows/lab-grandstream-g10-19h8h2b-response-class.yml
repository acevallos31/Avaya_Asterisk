name: G10-19H8H2B | Issabel Lab | Native Response Class Diagnostic

on:
  push:
    branches: [Audit]
    paths:
      - 'deploy/grandstream/prepare-g10-19h8h2b-diagnostic-helper.py'
      - 'deploy/grandstream/prepare-g10-19h8h2b-output-helper.py'
      - '.github/workflows/lab-grandstream-g10-19h8h2b-response-class.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Capture only response/status after browser-equivalent native session patch
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare restricted H8H2 + diagnostic actions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'Audit'
          python3 -B deploy/grandstream/prepare-g10-19h8h2-helper.py
          python3 -B deploy/grandstream/prepare-g10-19h8h2b-diagnostic-helper.py
          python3 -B deploy/grandstream/prepare-integrated-applyconfig-helper.py
          python3 -B deploy/grandstream/prepare-g10-19h8h2b-output-helper.py
          bash -n deploy/j129/avaya-j129-lab-deploy

      - name: Sync restricted privileged helper
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(sudo -n /usr/local/sbin/avaya-j129-helper-sync)"
          printf '%s\n' "$OUT"
          grep -Fq 'HELPER-SYNC-ALL-PASS' <<<"$OUT"

      - name: Apply temporary H8H2 session patch and safe classifier
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$RUNNER_TEMP/g10-19h8h2b-before.txt"
          sudo -n /usr/local/sbin/avaya-j129-lab-deploy inspect-grandstream-h8h2-session-patch | tee "$BEFORE"
          grep -Fq 'h8h2_patch_state=READY' "$BEFORE"
          sudo -n /usr/local/sbin/avaya-j129-lab-deploy apply-grandstream-h8h2-session-patch \
            | tee "$RUNNER_TEMP/g10-19h8h2b-h8h2-apply.txt"
          sudo -n /usr/local/sbin/avaya-j129-lab-deploy apply-grandstream-h8h2b-response-classifier \
            | tee "$RUNNER_TEMP/g10-19h8h2b-classifier-apply.txt"
          grep -Fq 'GRANDSTREAM-H8H2B-RESPONSE-CLASSIFIER-APPLY-PASS' "$RUNNER_TEMP/g10-19h8h2b-classifier-apply.txt"

      - name: Run one native Endpoint Configurator attempt and capture safe response class
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/g10-19h8h2b-native.txt"
          set +e
          sudo -n /usr/local/sbin/avaya-j129-lab-deploy run-grandstream-integrated-applyconfig | tee "$REPORT"
          HELPER_RC=${PIPESTATUS[0]}
          set -e
          echo "integrated_helper_rc=$HELPER_RC" >> "$REPORT"
          grep -Fq 'h8h2b_response_class_seen=YES' "$REPORT"
          grep -Eq '^G10-19H8H2B-RESPONSE-CLASS response=[A-Za-z0-9_.-]{1,40} status=[A-Za-z0-9_.-]{1,40}$' "$REPORT"
          echo 'G10-19H8H2B-DIAGNOSTIC-CAPTURE=PASS' >> "$REPORT"

      - name: Roll back diagnostic and H8H2 live-code patches
        if: always()
        shell: bash
        run: |
          set +e
          DIAG_RC=0
          H8H2_RC=0
          sudo -n /usr/local/sbin/avaya-j129-lab-deploy rollback-grandstream-h8h2b-response-classifier \
            | tee "$RUNNER_TEMP/g10-19h8h2b-classifier-rollback.txt" || DIAG_RC=$?
          sudo -n /usr/local/sbin/avaya-j129-lab-deploy rollback-grandstream-h8h2-session-patch \
            | tee "$RUNNER_TEMP/g10-19h8h2b-h8h2-rollback.txt" || H8H2_RC=$?
          echo "classifier_rollback_rc=$DIAG_RC" >> "$GITHUB_STEP_SUMMARY"
          echo "h8h2_rollback_rc=$H8H2_RC" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DIAG_RC" -ne 0 ] || [ "$H8H2_RC" -ne 0 ]; then exit 1; fi

      - name: Publish sanitized diagnostic
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/g10-19h8h2b-native.txt"
          {
            echo '## G10-19H8H2B — Native response classification'
            echo 'phone_password_logged=NO'
            echo 'sid_or_cookie_value_logged=NO'
            echo 'submitted_pvalue_payload_logged=NO'
            [ -f "$REPORT" ] && grep -E '^(applyconfig_rc=|grandstream_start_seen=|grandstream_finished_seen=|grandstream_failed_seen=|h8h2b_response_class_seen=|G10-19H8H2B-RESPONSE-CLASS|integrated_helper_rc=|G10-19H8H2B-DIAGNOSTIC-CAPTURE=)' "$REPORT" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g10-19h8h2b-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/g10-19h8h2b-before.txt
            ${{ runner.temp }}/g10-19h8h2b-native.txt
            ${{ runner.temp }}/g10-19h8h2b-classifier-rollback.txt
            ${{ runner.temp }}/g10-19h8h2b-h8h2-rollback.txt
          if-no-files-found: warn
          retention-days: 30
