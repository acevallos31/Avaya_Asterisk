name: 47 | J129 Production | Physical Call | Controlled E2E

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo: preflight o call'
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - call
      confirm:
        description: 'preflight: PREFLIGHT-PROD-J129-CALL ; call: CALL-PROD-J129'
        required: true
        type: string
      extension:
        description: 'Extensión SIP del J129 (solo requerida en call)'
        required: false
        type: string
      phone_ip:
        description: 'IP del J129 para RTP debug específico (opcional)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  controlled-physical-call:
    name: Validar llamada controlada Asterisk hacia J129
    runs-on: [self-hosted, Linux, X64, j129-production, cei-pbx02]
    timeout-minutes: 8

    steps:
      - name: Guard de producción
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "Audit"
          test "$(hostname -s)" = 'cei-pbx02'
          test "$(id -un)" = 'github-runner-prod'
          case '${{ inputs.mode }}' in
            preflight)
              test '${{ inputs.confirm }}' = 'PREFLIGHT-PROD-J129-CALL'
              ;;
            call)
              test '${{ inputs.confirm }}' = 'CALL-PROD-J129'
              ;;
            *) exit 2 ;;
          esac
          echo 'J129-PROD-CALL-GUARD-PASS'

      - name: Verificar helper privilegiado restringido
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/sbin/avaya-j129-prod-call-test || {
            echo 'J129-PROD-CALL-HELPER-NOT-INSTALLED'
            exit 1
          }
          test "$(stat -c '%U:%G:%a' /usr/local/sbin/avaya-j129-prod-call-test)" = 'root:root:755'
          sudo -n -l 2>&1 | grep -F '/usr/local/sbin/avaya-j129-prod-call-test' >/dev/null
          echo 'J129-PROD-CALL-HELPER-GUARD-PASS'

      - name: Preflight helper Asterisk
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/avaya-j129-prod-call-test preflight \
            | tee "$RUNNER_TEMP/j129-call-e2e.log"
          grep -F 'J129-PROD-CALL-HELPER-PREFLIGHT-PASS' "$RUNNER_TEMP/j129-call-e2e.log"

      - name: Validar inputs y peer
        if: ${{ inputs.mode == 'call' }}
        shell: bash
        run: |
          set -euo pipefail
          EXT='${{ inputs.extension }}'
          IP='${{ inputs.phone_ip }}'
          [[ "$EXT" =~ ^[0-9]{2,8}$ ]] || { echo 'Invalid extension'; exit 2; }
          if [ -n "$IP" ]; then
            [[ "$IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo 'Invalid phone_ip'; exit 2; }
          fi
          sudo -n /usr/local/sbin/avaya-j129-prod-call-test peer "$EXT" \
            | tee -a "$RUNNER_TEMP/j129-call-e2e.log"
          grep -F 'J129-PROD-CALL-PEER-READY-PASS' "$RUNNER_TEMP/j129-call-e2e.log"

      - name: Originar llamada con debug temporal y cleanup interno
        if: ${{ inputs.mode == 'call' }}
        shell: bash
        run: |
          set -euo pipefail
          EXT='${{ inputs.extension }}'
          IP='${{ inputs.phone_ip }}'
          if [ -n "$IP" ]; then
            sudo -n /usr/local/sbin/avaya-j129-prod-call-test call "$EXT" "$IP" \
              | tee -a "$RUNNER_TEMP/j129-call-e2e.log"
          else
            sudo -n /usr/local/sbin/avaya-j129-prod-call-test call "$EXT" \
              | tee -a "$RUNNER_TEMP/j129-call-e2e.log"
          fi
          grep -F 'J129-PROD-CALL-DEBUG-CLEANUP-DONE' "$RUNNER_TEMP/j129-call-e2e.log"
          grep -F 'J129-PROD-CALL-AUTOMATED-PHASE-PASS' "$RUNNER_TEMP/j129-call-e2e.log"

      - name: Cleanup defensivo
        if: always()
        shell: bash
        run: |
          if [ -x /usr/local/sbin/avaya-j129-prod-call-test ]; then
            sudo -n /usr/local/sbin/avaya-j129-prod-call-test cleanup >>"$RUNNER_TEMP/j129-call-e2e.log" 2>&1 || true
          fi

      - name: Guardar evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j129-production-call-e2e-${{ inputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/j129-call-e2e.log
          if-no-files-found: ignore
          retention-days: 90

      - name: Resultado preflight
        if: ${{ success() && inputs.mode == 'preflight' }}
        shell: bash
        run: |
          echo 'J129-PROD-CALL-E2E-PREFLIGHT-PASS'
          echo 'NOTE=No se originó ninguna llamada.'

      - name: Resultado llamada automatizada
        if: ${{ success() && inputs.mode == 'call' }}
        shell: bash
        run: |
          echo 'J129-PROD-CALL-E2E-AUTOMATED-PASS'
          echo 'NOTE=La confirmación física de timbrado, answer y audio debe registrarse manualmente después del run.'
