name: "68 | Issabel Lab | Endpoint Credentials | Runtime Smoke"

on:
  push:
    branches:
      - feature/endpoint-credential-foundation
    paths:
      - ".github/workflows/lab-endpoint-credential-test68.yml"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Escriba INSTALL-ENDPOINT-CREDENTIALS-LAB"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: endpoint-credential-runtime-lab
  cancel-in-progress: false

jobs:
  static-audit:
    name: Static runtime security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run credential foundation audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.audit.test_endpoint_credential_foundation -v
          bash -n deploy/j129/avaya-j129-lab-deploy
          php -l deploy/endpoint-configurator/bin/credential-vault-cli.php

  lab-runtime-smoke:
    name: Install runtime and authenticate GRP2601P
    needs: static-audit
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    timeout-minutes: 15
    env:
      GRP2601P_LABEL_PASSWORD: ${{ secrets.GRANDSTREAM_GRP2601P_EC74D71EE8E3_HTTP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guardar identidad, rama y confirmación LAB
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feature/endpoint-credential-foundation"
          test "$(id -un)" = "github-runner"
          if printf '%s' "$(hostname)" | grep -Eqi 'prod|cei-pbx02'; then
            echo "ERROR: hostname de producción detectado" >&2
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            test '${{ inputs.confirmation }}' = 'INSTALL-ENDPOINT-CREDENTIALS-LAB'
          fi
          test -n "${GRP2601P_LABEL_PASSWORD}"
          test -x /usr/local/sbin/avaya-j129-helper-sync
          sudo -n -l | grep -F '/usr/local/sbin/avaya-j129-helper-sync'
          sudo -n -l | grep -F '/usr/local/sbin/avaya-j129-lab-deploy'

      - name: Sincronizar helper restringido
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/avaya-j129-helper-sync

      - name: Instalar esquema persistente de credenciales en LAB
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/avaya-j129-lab-deploy ensure-endpoint-credentials

      - name: Instalar y verificar runtime de Endpoint Configurator
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/avaya-j129-lab-deploy install-endpoint-credential-runtime "${GITHUB_WORKSPACE}"

      - name: Guardar override cifrado y validar login read-only
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${GRP2601P_LABEL_PASSWORD}" |
            sudo /usr/local/sbin/avaya-j129-lab-deploy credential-smoke-grp2601p

      - name: Verificación final sanitizada
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/avaya-j129-lab-deploy verify-endpoint-credential-runtime "${GITHUB_WORKSPACE}"
          sudo /usr/local/libexec/issabel-endpoint-credential-vault status EC:74:D7:1E:E8:E3 |
            grep -Eq '^validation_status=VALIDATED$'
          echo 'TEST68-LAB-RUNTIME-SMOKE=PASS'
          echo 'production_touched=NO'
