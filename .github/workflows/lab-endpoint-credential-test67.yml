name: "67 | Issabel Lab | Endpoint Credentials | Foundation"

on:
  push:
    branches:
      - feature/endpoint-credential-foundation
    paths:
      - ".github/workflows/lab-endpoint-credential-test67.yml"
      - "deploy/endpoint-configurator/**"
      - "deploy/j129/avaya-j129-lab-deploy"
      - "var/www/html/modules/endpoint_configurator/**"
      - "tests/audit/test_endpoint_credential_foundation.py"
      - "CONTEXT.md"
      - "docs/agent-log.md"
      - "docs/j129-test-registry.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    name: Static credential foundation audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Test 67 static audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.audit.test_endpoint_credential_foundation -v

  lab-schema-cycle:
    name: LAB schema apply verify rollback
    if: github.event_name == 'workflow_dispatch'
    needs: static-audit
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guardar identidad y entorno LAB
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feature/endpoint-credential-foundation"
          test "$(id -un)" = "github-runner"
          test -x /usr/local/sbin/avaya-j129-helper-sync
          test -x /usr/local/sbin/avaya-j129-lab-deploy
          sudo -n -l | grep -F '/usr/local/sbin/avaya-j129-helper-sync'
          sudo -n -l | grep -F '/usr/local/sbin/avaya-j129-lab-deploy'
          if printf '%s' "$(hostname)" | grep -Eqi 'prod|cei-pbx02'; then
            echo "ERROR: hostname de producción detectado" >&2
            exit 1
          fi

      - name: Sincronizar helper restringido
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/avaya-j129-helper-sync
          test -x /usr/local/sbin/avaya-j129-lab-deploy

      - name: Aplicar esquema de credenciales en LAB
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/avaya-j129-lab-deploy install-endpoint-credentials

      - name: Rollback obligatorio del esquema de prueba
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/avaya-j129-lab-deploy rollback-endpoint-credentials
# rerun after LAB DBA grant
