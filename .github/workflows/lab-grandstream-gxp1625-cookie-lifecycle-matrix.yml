name: G10-17H | Issabel Lab | GXP1625 Cookie Lifecycle Matrix | Controlled Test

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN-G10-17H to allow the same-value P208 write probe'
        required: true
        type: string

permissions:
  contents: read

jobs:
  g10_17h:
    name: Grandstream GXP1625 cookie lifecycle controlled write probe
    runs-on: [self-hosted, linux]
    env:
      GRANDSTREAM_HTTP_USERNAME: admin
      GRANDSTREAM_HTTP_PASSWORD: ${{ secrets.GRANDSTREAM_GXP1625_HTTP_PASSWORD }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Audit branch, runner and confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'Audit'
          test "$(id -un)" = 'github-runner'
          test "$CONFIRMATION" = 'RUN-G10-17H'
          test -n "${GRANDSTREAM_HTTP_PASSWORD:-}"
          echo 'credential_source=GITHUB-ACTIONS-SECRET'
          echo 'credential_value=NOT-PRINTED'

      - name: Validate diagnostic script
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/grandstream-gxp1625-cookie-lifecycle-matrix.py
          grep -Fq 'read_cookie_changed' scripts/grandstream-gxp1625-cookie-lifecycle-matrix.py
          grep -Fq 'phone_write=SAME-VALUE-P208-ONLY' scripts/grandstream-gxp1625-cookie-lifecycle-matrix.py

      - name: Run G10-17H controlled cookie lifecycle probe
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/g10-17h-grandstream-cookie-lifecycle-matrix.txt"
          python3 scripts/grandstream-gxp1625-cookie-lifecycle-matrix.py "$REPORT"
          grep -Fq 'G10-17H-COMPLETE' "$REPORT"
          ! grep -Fq "$GRANDSTREAM_HTTP_PASSWORD" "$REPORT"

      - name: Job summary
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/g10-17h-grandstream-cookie-lifecycle-matrix.txt"
          {
            echo '## G10-17H Grandstream GXP1625 cookie lifecycle matrix'
            echo
            echo '| Guardrail | Value |'
            echo '|---|---|'
            echo '| PBX | `Issabel LAB` |'
            echo '| Branch | `Audit` |'
            echo '| DB writes | `NONE` |'
            echo '| Live code writes | `NONE` |'
            echo '| Phone write | `P208 same-current-value only` |'
            echo '| SID/cookie/password values logged | `NO` |'
            echo
            grep -E '^(login_|sid_present|cookie_count_after_login|read_|cookie_count_before_post|post_|diagnostic|G10-17H-COMPLETE)' "$REPORT" | sed 's/^/`/; s/$/`  /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized report
        uses: actions/upload-artifact@v4
        with:
          name: g10-17h-grandstream-cookie-lifecycle-${{ github.run_id }}
          path: ${{ runner.temp }}/g10-17h-grandstream-cookie-lifecycle-matrix.txt
          retention-days: 30
