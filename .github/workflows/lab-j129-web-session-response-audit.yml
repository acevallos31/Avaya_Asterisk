name: Issabel Lab J129 Web Session Response Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-guard:
    name: Ejecutar solo desde Audit
    runs-on: ubuntu-latest
    steps:
      - name: Validar rama seleccionada
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "Audit" ]; then
            echo "Este workflow debe ejecutarse seleccionando la rama Audit en Run workflow."
            echo "Rama actual: ${GITHUB_REF_NAME}"
            exit 1
          fi

  audit:
    name: Auditar respuesta de sesion web J129
    needs: branch-guard
    runs-on: [self-hosted, linux, x64]
    env:
      J129_WEB_USER: admin
      J129_WEB_PASSWORD: ${{ secrets.J129_WEB_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verificar identidad del runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = "github-runner"
          test "$(hostname -s)" = "issabel"

      - name: Validar secreto
        shell: bash
        run: |
          set -euo pipefail
          test -n "${J129_WEB_PASSWORD:-}" || { echo "ERROR: falta J129_WEB_PASSWORD"; exit 2; }

      - name: Ejecutar auditoria sanitizada read-only
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${J129_WEB_PASSWORD}"
          python3 tests/lab/j129_web_session_response_audit.py
