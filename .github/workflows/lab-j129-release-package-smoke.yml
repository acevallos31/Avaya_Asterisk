name: 13 | Issabel Lab | J129 Release Package | Smoke Test

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escriba TEST-RELEASE para probar el paquete exacto release/j129-v0.1.0'
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  release-package-smoke:
    name: Validar paquete autocontenido v0.1.0 y rollback exacto
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    steps:
      - name: Sanear bloqueo legado del workspace antes de checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='/opt/actions-runner/_work/Avaya_Asterisk/Avaya_Asterisk'
          test "$GITHUB_WORKSPACE" = "$expected"

          base="$GITHUB_WORKSPACE/deploy/j129"
          quarantine_root="$(dirname "$GITHUB_WORKSPACE")/.runner-root-pycache-${GITHUB_RUN_ID}"
          [ -d "$base" ] || exit 0
          test ! -e "$quarantine_root"

          found=0
          while IFS= read -r -d '' cache; do
            if find "$cache" -type f -name '*.pyc' -user root -print -quit 2>/dev/null | grep -q .; then
              mkdir -p "$quarantine_root"
              target="$quarantine_root/cache-${found}"
              mv -- "$cache" "$target"
              echo "LEGACY-ROOT-PYCACHE-MOVED-OUTSIDE-WORKSPACE=$target"
              found=$((found + 1))
            fi
          done < <(find "$base" -type d \( -name '__pycache__' -o -name '.runner-root-pycache-*' \) -print0 2>/dev/null)

          echo "LEGACY-ROOT-PYCACHE-QUARANTINE-COUNT=$found"

      - name: Checkout harness Audit
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Guard de LAB
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(id -un)@$(hostname)"
          echo "Branch harness: $GITHUB_REF_NAME"
          test "$(id -un)" = "github-runner"
          test "$GITHUB_REF_NAME" = "Audit"
          test '${{ inputs.confirm }}' = 'TEST-RELEASE'

      - name: Checkout release exacta
        uses: actions/checkout@v4
        with:
          ref: release/j129-v0.1.0
          path: _release_checkout

      - name: Validacion estatica de la release
        shell: bash
        run: |
          set -euo pipefail
          test -f _release_checkout/release/j129-v0.1.0/install.sh
          test -f _release_checkout/release/j129-v0.1.0/payload/usr/share/issabel/endpoint-classes/class/issabel/vendor/Avaya.py
          test -f _release_checkout/release/j129-v0.1.0/payload/usr/share/issabel/endpoint-classes/tpl/Avaya_J129.tpl
          test -f _release_checkout/release/j129-v0.1.0/payload/usr/share/issabel/endpoint-classes/tpl/Avaya_global_SIP.tpl
          test -f _release_checkout/release/j129-v0.1.0/payload/etc/httpd/conf.d/avaya-j129-provisioning.conf
          bash -n _release_checkout/release/j129-v0.1.0/install.sh
          python3 -B -c "import ast; p='_release_checkout/release/j129-v0.1.0/payload/usr/share/issabel/endpoint-classes/class/issabel/vendor/Avaya.py'; ast.parse(open(p, encoding='utf-8').read(), filename=p); print('RELEASE-PY-SYNTAX-PASS')"

      - name: Preparar helper restringido
        shell: bash
        run: |
          set -euo pipefail
          python3 -B deploy/j129/prepare-release-package-cycle.py
          bash -n deploy/j129/avaya-j129-lab-deploy
          sudo /usr/local/sbin/avaya-j129-helper-sync

      - name: Ejecutar release exacta en LAB
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/avaya-j129-lab-deploy release-package-cycle-v010 "$GITHUB_WORKSPACE/_release_checkout"

      - name: Verificar workspace limpio de bytecode privilegiado
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          if find "$GITHUB_WORKSPACE/deploy/j129" -type f -name '*.pyc' -user root -print -quit 2>/dev/null | grep -q .; then
            echo 'ERROR: persiste bytecode Python propiedad de root dentro del workspace' >&2
            find "$GITHUB_WORKSPACE/deploy/j129" -type f -name '*.pyc' -user root -print 2>/dev/null || true
            exit 1
          fi
          echo 'RUNNER-WORKSPACE-NO-ROOT-PYC-PASS'

      - name: Resultado
        shell: bash
        run: |
          echo 'J129-RELEASE-PACKAGE-V010-SMOKE-PASS'
