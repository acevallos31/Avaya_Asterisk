name: 13 | Issabel Lab | J129 Release Package | Smoke Test

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escriba TEST-RELEASE para probar el paquete exacto release/j129-v0.1.0'
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  release-package-smoke:
    name: Validar paquete autocontenido v0.1.0 y rollback exacto
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    steps:
      - name: Checkout harness Audit
        uses: actions/checkout@v4

      - name: Guard de LAB
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(id -un)@$(hostname)"
          echo "Branch harness: $GITHUB_REF_NAME"
          test "$(id -un)" = "github-runner"
          test "$GITHUB_REF_NAME" = "Audit"
          test '${{ inputs.confirm }}' = 'TEST-RELEASE'

      - name: Checkout release exacta
        uses: actions/checkout@v4
        with:
          ref: release/j129-v0.1.0
          path: _release_checkout

      - name: Validacion estatica de la release
        shell: bash
        run: |
          set -euo pipefail
          test -f _release_checkout/release/j129-v0.1.0/install.sh
          test -f _release_checkout/release/j129-v0.1.0/payload/usr/share/issabel/endpoint-classes/class/issabel/vendor/Avaya.py
          test -f _release_checkout/release/j129-v0.1.0/payload/usr/share/issabel/endpoint-classes/tpl/Avaya_J129.tpl
          test -f _release_checkout/release/j129-v0.1.0/payload/usr/share/issabel/endpoint-classes/tpl/Avaya_global_SIP.tpl
          test -f _release_checkout/release/j129-v0.1.0/payload/etc/httpd/conf.d/avaya-j129-provisioning.conf
          bash -n _release_checkout/release/j129-v0.1.0/install.sh
          python3 -c "import ast; p='_release_checkout/release/j129-v0.1.0/payload/usr/share/issabel/endpoint-classes/class/issabel/vendor/Avaya.py'; ast.parse(open(p, encoding='utf-8').read(), filename=p); print('RELEASE-PY-SYNTAX-PASS')"

      - name: Preparar helper restringido
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/j129/prepare-release-package-cycle.py
          bash -n deploy/j129/avaya-j129-lab-deploy
          sudo /usr/local/sbin/avaya-j129-helper-sync

      - name: Ejecutar release exacta en LAB
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/avaya-j129-lab-deploy release-package-cycle-v010 "$GITHUB_WORKSPACE/_release_checkout"

      - name: Resultado
        shell: bash
        run: |
          echo 'J129-RELEASE-PACKAGE-V010-SMOKE-PASS'
