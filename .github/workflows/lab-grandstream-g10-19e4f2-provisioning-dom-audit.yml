name: G10-19E4F2 | Endpoint Lab | GXP1625 Provisioning DOM Audit

on:
  push:
    branches: [Audit]
    paths:
      - 'endpoint-lab/grandstream/g10-19e4f2-provisioning-dom-audit.js'
      - '.github/workflows/lab-grandstream-g10-19e4f2-provisioning-dom-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Inspect provisioning control shape without writes
    runs-on: [self-hosted, Linux, X64, endpoint-lab, debian, grandstream-lab]
    timeout-minutes: 5
    env:
      PHONE_PASSWORD: ${{ secrets.GRANDSTREAM_GXP1625_HTTP_PASSWORD }}
      PHONE_USERNAME: admin
      PHONE_BASE: http://192.168.1.167
    steps:
      - uses: actions/checkout@v4
      - name: Read-only DOM audit
        shell: bash
        run: |
          set -euo pipefail
          command -v chromium >/dev/null
          test -n "$PHONE_PASSWORD"
          export REPORT_PATH="$RUNNER_TEMP/g10-19e4f2.txt"
          node endpoint-lab/grandstream/g10-19e4f2-provisioning-dom-audit.js
          grep -Fq 'G10-19E4F2-COMPLETE=YES' "$REPORT_PATH"
      - name: Publish sanitized summary
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/g10-19e4f2.txt"
          {
            echo '## G10-19E4F2 — Provisioning DOM audit'
            echo
            [ -f "$REPORT" ] && cat "$REPORT" || echo 'report=NOT_CREATED'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g10-19e4f2-${{ github.run_id }}
          path: ${{ runner.temp }}/g10-19e4f2.txt
          if-no-files-found: warn
          retention-days: 30
