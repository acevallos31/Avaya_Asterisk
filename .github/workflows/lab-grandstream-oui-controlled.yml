name: G-TMP-03 | Issabel Lab | Grandstream OUI | Controlled Change

on:
  workflow_dispatch:
    inputs:
      action:
        description: Fase disponible actualmente
        required: true
        default: validate
        type: choice
        options:
          - validate

permissions:
  contents: read

jobs:
  controlled-oui:
    name: Grandstream C0:74:AD validation
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Audit branch and runner
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "Audit"
          test "$(id -un)" = "github-runner"

      - name: Sync authorized existing helper
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/sbin/avaya-j129-helper-sync
          sudo -n -l | grep -F '/usr/local/sbin/avaya-j129-helper-sync'
          sudo -n /usr/local/sbin/avaya-j129-helper-sync
          sudo -n -l | grep -F '/usr/local/sbin/avaya-j129-lab-deploy'

      - name: Validate Grandstream OUI state read-only
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/grandstream-oui-controlled.txt"
          sudo -n /usr/local/sbin/avaya-j129-lab-deploy inspect-manufacturer Grandstream GXP1625 C0:74:AD | tee "$REPORT"

          grep -Fq 'MANUFACTURER-DB-READONLY-PASS' "$REPORT"
          grep -Fq $'10\tGrandstream\tGrandstream' "$REPORT"
          grep -Fq $'134\t10\tGXP1625\tGXP1625' "$REPORT"

          if awk '/=== REQUESTED PREFIX LOOKUP ===/{f=1;next}/=== ENDPOINT COUNT ===/{f=0} f && $0 ~ /C0:74:AD/ {found=1} END{exit !found}' "$REPORT"; then
            echo 'VALIDATION-RESULT=OUI-PRESENT' | tee -a "$REPORT"
          else
            echo 'VALIDATION-RESULT=OUI-ABSENT' | tee -a "$REPORT"
          fi

          echo 'G-TMP-03-VALIDATE-PASS' | tee -a "$REPORT"

      - name: Job summary
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/grandstream-oui-controlled.txt"
          STATE='UNKNOWN'
          [ -f "$REPORT" ] && grep -Fq 'VALIDATION-RESULT=OUI-ABSENT' "$REPORT" && STATE='ABSENT' || true
          [ -f "$REPORT" ] && grep -Fq 'VALIDATION-RESULT=OUI-PRESENT' "$REPORT" && STATE='PRESENT' || true
          {
            echo '## G-TMP-03 Grandstream OUI validation'
            echo
            echo '| Field | Value |'
            echo '|---|---|'
            echo '| Manufacturer | `Grandstream` |'
            echo '| Manufacturer ID | `10` |'
            echo '| Model | `GXP1625` |'
            echo '| Model ID | `134` |'
            echo '| OUI | `C0:74:AD` |'
            echo "| Live DB state | \`$STATE\` |"
            echo '| DB operation | `READ ONLY` |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grandstream-oui-validate-${{ github.run_id }}
          path: ${{ runner.temp }}/grandstream-oui-controlled.txt
          if-no-files-found: error
          retention-days: 30
