name: 52 | PBX & Runner Baseline | Read-Only Audit

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'PBX / runner a auditar'
        required: true
        default: lab
        type: choice
        options:
          - lab
          - ceiba-production
      confirm:
        description: 'Solo producción: escriba AUDIT-PROD. En LAB puede dejarse vacío.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  audit-lab:
    if: ${{ inputs.target == 'lab' }}
    name: Baseline LAB
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Guard LAB
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = "github-runner"
          echo "BASELINE-TARGET=lab"

      - name: Ejecutar auditoría común read-only
        shell: bash
        env:
          TARGET: lab
          EXPECTED_USER: github-runner
        run: |
          set -euo pipefail
          bash scripts/pbx-runner-baseline-audit.sh

  audit-ceiba-production:
    if: ${{ inputs.target == 'ceiba-production' }}
    name: Baseline Ceiba Production
    runs-on: [self-hosted, Linux, X64, j129-production, cei-pbx02]
    timeout-minutes: 15
    steps:
      - name: Guard estricto de producción
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "Audit"
          test '${{ inputs.confirm }}' = 'AUDIT-PROD'
          test "$(id -un)" = "github-runner-prod"
          test "$(hostname -s)" = "cei-pbx02"
          echo 'PRODUCTION-BASELINE-RUNNER-GUARD-PASS'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Ejecutar auditoría común read-only
        shell: bash
        env:
          TARGET: ceiba-production
          EXPECTED_USER: github-runner-prod
          EXPECTED_HOST: cei-pbx02
        run: |
          set -euo pipefail
          bash scripts/pbx-runner-baseline-audit.sh
