name: 53 | Ceiba Production | Avaya Fleet | Read-Only Audit

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escriba AUDIT-CEIBA-AVAYA-FLEET'
        required: true
        type: string
      fail_on_issues:
        description: 'Marcar rojo si hay Avaya configurados sin registro, sin provisioning, con credenciales distintas, sin descarga o con MAC viva distinta'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  audit-avaya-fleet:
    name: Inventariar Avaya detectados/configurados en cei-pbx02
    runs-on:
      - self-hosted
      - Linux
      - X64
      - j129-production
      - cei-pbx02
    timeout-minutes: 10
    env:
      CONFIRM: ${{ inputs.confirm }}
      FAIL_ON_ISSUES: ${{ inputs.fail_on_issues }}

    steps:
      - name: Guard de producción
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "Audit"
          test "$CONFIRM" = 'AUDIT-CEIBA-AVAYA-FLEET'
          test "$(hostname -s)" = 'cei-pbx02'
          test "$(id -un)" = 'github-runner-prod'
          echo 'CEIBA-AVAYA-FLEET-GUARD-PASS'

      - name: Checkout harness Audit
        uses: actions/checkout@v4
        with:
          ref: Audit
          persist-credentials: false

      - name: Validar harness y helper del repositorio
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/j129/avaya-j129-prod-validation
          grep -F 'J129-PROD-FLEET-SCHEMA=3' deploy/j129/avaya-j129-prod-validation >/dev/null
          python3 -m py_compile .github/scripts/avaya_fleet_report.py
          echo 'CEIBA-AVAYA-FLEET-REPO-HARNESS-PASS'

      - name: Verificar helper instalado en producción
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/sbin/avaya-j129-prod-validation
          test "$(stat -c '%U:%G:%a' /usr/local/sbin/avaya-j129-prod-validation)" = 'root:root:755'
          sudo -n -l 2>&1 | grep -F '/usr/local/sbin/avaya-j129-prod-validation' >/dev/null
          if ! grep -F 'J129-PROD-FLEET-SCHEMA=3' /usr/local/sbin/avaya-j129-prod-validation >/dev/null; then
            echo 'CEIBA-AVAYA-FLEET-HELPER-UPDATE-REQUIRED'
            echo 'El helper instalado todavía no contiene el esquema 3 de fleet-audit.'
            exit 2
          fi
          echo 'CEIBA-AVAYA-FLEET-INSTALLED-HELPER-PASS'

      - name: Auditar flota Avaya read-only
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/ceiba-avaya-fleet-audit.txt"
          sudo -n /usr/local/sbin/avaya-j129-prod-validation fleet-audit | tee "$LOG"
          grep -F 'J129-PROD-FLEET-AUDIT-PASS' "$LOG" >/dev/null
          grep -F 'J129-PROD-FLEET-SUMMARY ' "$LOG" >/dev/null
          cp "$LOG" ./ceiba-avaya-fleet-audit.txt

      - name: Generar resumen visual, JSON y PDF
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/avaya_fleet_report.py \
            ./ceiba-avaya-fleet-audit.txt \
            --json ./ceiba-avaya-fleet-audit.json \
            --pdf ./ceiba-avaya-fleet-audit.pdf \
            --summary "$GITHUB_STEP_SUMMARY"

          python3 -m json.tool ./ceiba-avaya-fleet-audit.json >/dev/null
          test "$(head -c 5 ./ceiba-avaya-fleet-audit.pdf)" = '%PDF-'
          test -s ./ceiba-avaya-fleet-audit.txt
          test -s ./ceiba-avaya-fleet-audit.json
          test -s ./ceiba-avaya-fleet-audit.pdf
          echo 'CEIBA-AVAYA-FLEET-REPORTS-PASS formats=TXT,JSON,PDF'

      - name: Aplicar criterio fail_on_issues
        if: ${{ inputs.fail_on_issues }}
        shell: bash
        run: |
          set -euo pipefail
          summary="$(grep -F 'J129-PROD-FLEET-SUMMARY ' ./ceiba-avaya-fleet-audit.txt | tail -n1)"
          get_count() { printf '%s\n' "$summary" | sed -n -E "s/.*$1=([0-9]+).*/\\1/p"; }
          test "$(get_count not_registered)" -eq 0
          test "$(get_count provisioning_missing)" -eq 0
          test "$(get_count credentials_mismatch)" -eq 0
          test "$(get_count config_not_requested)" -eq 0
          test "$(get_count live_mac_mismatch)" -eq 0
          echo 'CEIBA-AVAYA-FLEET-STRICT-CRITERIA-PASS'

      - name: Subir evidencia sanitizada TXT JSON PDF
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ceiba-avaya-fleet-audit-${{ github.run_id }}
          path: |
            ceiba-avaya-fleet-audit.txt
            ceiba-avaya-fleet-audit.json
            ceiba-avaya-fleet-audit.pdf
          if-no-files-found: error
          retention-days: 14
