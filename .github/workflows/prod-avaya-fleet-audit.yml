name: 53 | Ceiba Production | Avaya Fleet | Read-Only Audit

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escriba AUDIT-CEIBA-AVAYA-FLEET'
        required: true
        type: string
      fail_on_issues:
        description: 'Marcar rojo si hay Avaya configurados sin registro, sin provisioning, con credenciales distintas o sin descarga del archivo'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  audit-avaya-fleet:
    name: Inventariar Avaya detectados/configurados en cei-pbx02
    runs-on:
      - self-hosted
      - Linux
      - X64
      - j129-production
      - cei-pbx02
    timeout-minutes: 10
    env:
      CONFIRM: ${{ inputs.confirm }}
      FAIL_ON_ISSUES: ${{ inputs.fail_on_issues }}

    steps:
      - name: Guard de producción
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "Audit"
          test "$CONFIRM" = 'AUDIT-CEIBA-AVAYA-FLEET'
          test "$(hostname -s)" = 'cei-pbx02'
          test "$(id -un)" = 'github-runner-prod'
          echo 'CEIBA-AVAYA-FLEET-GUARD-PASS'

      - name: Checkout harness Audit
        uses: actions/checkout@v4
        with:
          ref: Audit
          persist-credentials: false

      - name: Validar helper del repositorio
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/j129/avaya-j129-prod-validation
          grep -F 'J129-PROD-FLEET-SCHEMA=2' deploy/j129/avaya-j129-prod-validation >/dev/null
          echo 'CEIBA-AVAYA-FLEET-REPO-HELPER-PASS'

      - name: Verificar helper instalado en producción
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/sbin/avaya-j129-prod-validation
          test "$(stat -c '%U:%G:%a' /usr/local/sbin/avaya-j129-prod-validation)" = 'root:root:755'
          sudo -n -l 2>&1 | grep -F '/usr/local/sbin/avaya-j129-prod-validation' >/dev/null
          if ! grep -F 'J129-PROD-FLEET-SCHEMA=2' /usr/local/sbin/avaya-j129-prod-validation >/dev/null; then
            echo 'CEIBA-AVAYA-FLEET-HELPER-UPDATE-REQUIRED'
            echo 'El helper instalado todavía no contiene el esquema 2 de fleet-audit.'
            echo 'Actualice únicamente /usr/local/sbin/avaya-j129-prod-validation con la versión de la rama Audit y vuelva a ejecutar.'
            exit 2
          fi
          echo 'CEIBA-AVAYA-FLEET-INSTALLED-HELPER-PASS'

      - name: Auditar flota Avaya read-only
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/ceiba-avaya-fleet-audit.txt"
          sudo -n /usr/local/sbin/avaya-j129-prod-validation fleet-audit | tee "$LOG"
          grep -F 'J129-PROD-FLEET-AUDIT-PASS' "$LOG" >/dev/null
          grep -F 'J129-PROD-FLEET-SUMMARY ' "$LOG" >/dev/null
          cp "$LOG" ./ceiba-avaya-fleet-audit.txt

      - name: Resumen visual de auditoría
        shell: bash
        run: |
          set -euo pipefail
          LOG='./ceiba-avaya-fleet-audit.txt'

          python3 - "$LOG" "$GITHUB_STEP_SUMMARY" <<'PY'
          import shlex
          import sys

          log_path, summary_path = sys.argv[1:3]

          def parse_kv(line):
              data = {}
              try:
                  parts = shlex.split(line, posix=True)
              except ValueError:
                  parts = line.split()
              for token in parts[1:]:
                  if '=' in token:
                      key, value = token.split('=', 1)
                      data[key] = value
              return data

          endpoints = []
          fleet = {}
          manufacturers = []

          with open(log_path, 'r', encoding='utf-8', errors='replace') as fh:
              for raw in fh:
                  line = raw.rstrip('\n')
                  if line.startswith('AVAYA-ENDPOINT '):
                      endpoints.append(parse_kv(line))
                  elif line.startswith('J129-PROD-FLEET-SUMMARY '):
                      fleet = parse_kv(line)
                  elif line.startswith('MANUFACTURER '):
                      manufacturers.append(parse_kv(line))

          def n(key):
              try:
                  return int(fleet.get(key, '0'))
              except ValueError:
                  return 0

          def esc(value):
              return str(value or 'NONE').replace('|', '\\|').replace('\n', ' ')

          def cred_status(ep):
              user = ep.get('credential_user', 'UNKNOWN')
              secret = ep.get('credential_secret', 'UNKNOWN')
              if user == 'MATCH' and secret == 'MATCH':
                  return '✅ MATCH'
              if user == 'MISMATCH' or secret == 'MISMATCH':
                  return '❌ MISMATCH'
              return '⚠️ UNKNOWN'

          def download_status(ep):
              if ep.get('config_request') == 'YES':
                  code = ep.get('request_http', 'UNKNOWN')
                  icon = '✅' if code.startswith('2') else '⚠️'
                  return '{} YES ({})'.format(icon, code)
              return '⚠️ NO EVIDENCE'

          def sip_status(ep):
              if ep.get('state') == 'CONFIGURED_REGISTERED':
                  return '✅ REGISTERED'
              return '❌ NOT REGISTERED'

          configured = [e for e in endpoints if e.get('account', 'NONE') != 'NONE']
          detected = [e for e in endpoints if e.get('account', 'NONE') == 'NONE']
          issues = [e for e in configured if e.get('state') != 'CONFIGURED_REGISTERED']

          lines = []
          lines += [
              '# 📞 Ceiba - Avaya Fleet Audit',
              '',
              '> Auditoría **solo lectura**. Las contraseñas SIP nunca se muestran; únicamente se informa MATCH/MISMATCH/UNKNOWN.',
              '',
              '## Estado general',
              '',
              '| Indicador | Resultado |',
              '|---|---:|',
              '| 🔎 Avaya detectados | **{}** |'.format(n('total')),
              '| ⚙️ Configurados | **{}** |'.format(n('configured')),
              '| ✅ Registrados | **{}** |'.format(n('registered')),
              '| ❌ Configurados sin registro | **{}** |'.format(n('not_registered')),
              '| 💤 Solo detectados | **{}** |'.format(n('detected_only')),
              '| 🔐 Credenciales coinciden | **{}** |'.format(n('credentials_match')),
              '| 🚨 Credenciales distintas | **{}** |'.format(n('credentials_mismatch')),
              '| ❓ Credenciales no verificables | **{}** |'.format(n('credentials_unknown')),
              '| 📥 Archivo solicitado | **{}** |'.format(n('config_requested')),
              '| ⚠️ Sin evidencia de descarga | **{}** |'.format(n('config_not_requested')),
              '',
          ]

          if issues:
              lines += ['## 🚨 Requieren atención', '']
              for ep in issues:
                  lines.append('- **Ext. {}** · {} · MAC `{}` · última IP `{}`'.format(
                      esc(ep.get('account')), esc(ep.get('state')), esc(ep.get('mac')), esc(ep.get('last_ip'))))
              lines.append('')
          else:
              lines += ['## ✅ Sin incidencias en los Avaya configurados', '']

          lines += [
              '## Teléfonos Avaya configurados',
              '',
              '| Ext. | Modelo | MAC | Última IP | Provisioning | Credenciales | Descarga config | SIP |',
              '|---:|---|---|---|---|---|---|---|',
          ]
          for ep in configured:
              prov = '✅ PRESENT' if ep.get('provisioning') == 'PRESENT' else '❌ MISSING'
              lines.append('| {} | {} | `{}` | `{}` | {} | {} | {} | {} |'.format(
                  esc(ep.get('account')), esc(ep.get('model')), esc(ep.get('mac')), esc(ep.get('last_ip')),
                  prov, cred_status(ep), download_status(ep), sip_status(ep)))

          lines += ['', '## Detalle de configuración y registro', '']
          for ep in configured:
              lines += [
                  '<details>',
                  '<summary><strong>Ext. {}</strong> · {} · {}</summary>'.format(
                      esc(ep.get('account')), esc(ep.get('model')), sip_status(ep)),
                  '',
                  '- MAC: `{}`'.format(esc(ep.get('mac'))),
                  '- Última IP detectada: `{}`'.format(esc(ep.get('last_ip'))),
                  '- IP SIP registrada: `{}`'.format(esc(ep.get('sip_ip'))),
                  '- User-Agent: `{}`'.format(esc(ep.get('useragent'))),
                  '- Usuario provisioning vs Asterisk: **{}**'.format(esc(ep.get('credential_user', 'UNKNOWN'))),
                  '- Secret provisioning vs Asterisk: **{}**'.format(esc(ep.get('credential_secret', 'UNKNOWN'))),
                  '- Solicitud de configuración: **{}**'.format(esc(ep.get('config_request', 'NO'))),
                  '- IP que solicitó archivo: `{}`'.format(esc(ep.get('request_ip'))),
                  '- HTTP: `{}`'.format(esc(ep.get('request_http'))),
                  '- Última solicitud encontrada: `{}`'.format(esc(ep.get('request_time'))),
                  '- Estado final: **{}**'.format(esc(ep.get('state'))),
                  '',
                  '</details>',
                  '',
              ]

          lines += [
              '## Avaya detectados sin extensión',
              '',
              '| Modelo | MAC | Última IP | Estado |',
              '|---|---|---|---|',
          ]
          for ep in detected:
              lines.append('| {} | `{}` | `{}` | 💤 DETECTED_ONLY |'.format(
                  esc(ep.get('model')), esc(ep.get('mac')), esc(ep.get('last_ip'))))

          lines += ['', '## Fabricantes vistos por Endpoint Configurator', '']
          for mf in manufacturers:
              lines.append('- **{}**: {} endpoint(s)'.format(esc(mf.get('name')), esc(mf.get('endpoints'))))

          lines += [
              '',
              '---',
              'Leyenda: ✅ correcto · ❌ requiere atención · ⚠️ revisar evidencia · 💤 detectado pero no configurado.',
              '',
              'El artefacto `ceiba-avaya-fleet-audit` conserva la evidencia sanitizada de esta ejecución.',
          ]

          with open(summary_path, 'a', encoding='utf-8') as out:
              out.write('\n'.join(lines) + '\n')
          PY

          if [ "$FAIL_ON_ISSUES" = 'true' ]; then
            summary="$(grep -F 'J129-PROD-FLEET-SUMMARY ' "$LOG" | tail -n1)"
            not_registered="$(printf '%s\n' "$summary" | sed -n -E 's/.*not_registered=([0-9]+).*/\1/p')"
            prov_missing="$(printf '%s\n' "$summary" | sed -n -E 's/.*provisioning_missing=([0-9]+).*/\1/p')"
            cred_mismatch="$(printf '%s\n' "$summary" | sed -n -E 's/.*credentials_mismatch=([0-9]+).*/\1/p')"
            not_requested="$(printf '%s\n' "$summary" | sed -n -E 's/.*config_not_requested=([0-9]+).*/\1/p')"
            test "${not_registered:-0}" -eq 0
            test "${prov_missing:-0}" -eq 0
            test "${cred_mismatch:-0}" -eq 0
            test "${not_requested:-0}" -eq 0
          fi
          echo 'CEIBA-AVAYA-FLEET-AUDIT-COMPLETE'

      - name: Subir evidencia sanitizada
        uses: actions/upload-artifact@v4
        with:
          name: ceiba-avaya-fleet-audit-${{ github.run_id }}
          path: ceiba-avaya-fleet-audit.txt
          if-no-files-found: error
          retention-days: 14
