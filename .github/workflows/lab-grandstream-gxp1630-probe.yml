name: G-TMP-01 | Issabel Lab | Grandstream Model Detection | Probe

on:
  workflow_dispatch:
    inputs:
      target_ip:
        description: 'IP del teléfono Grandstream a auditar'
        required: true
        type: string
      expected_model:
        description: 'Modelo esperado, por ejemplo GXP1625 o GXP1630'
        required: false
        type: string
      expected_mac:
        description: 'MAC esperada opcional (aa:bb:cc:dd:ee:ff)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  grandstream-model-probe:
    name: Probe genérico de detección Grandstream en LAB
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    timeout-minutes: 10

    env:
      TARGET_IP: ${{ inputs.target_ip }}
      EXPECTED_MODEL: ${{ inputs.expected_model }}
      EXPECTED_MAC: ${{ inputs.expected_mac }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inicializar reporte
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/grandstream-model-probe.txt"
          : > "$REPORT"
          {
            echo '=== GRANDSTREAM MODEL DETECTION PROBE ==='
            echo "target_ip=$TARGET_IP"
            echo "expected_model=${EXPECTED_MODEL:-NO-ESPECIFICADO}"
            echo "expected_mac=${EXPECTED_MAC:-NO-ESPECIFICADA}"
            echo "runner=$(id -un)@$(hostname -s)"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$REPORT"

      - name: Verificar identidad del runner
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/grandstream-model-probe.txt"
          test "$(id -un)" = "github-runner"
          {
            echo '=== RUNNER / NETWORK ==='
            ip -br addr
            ip route
          } | tee -a "$REPORT"

      - name: Confirmar presencia y MAC
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/grandstream-model-probe.txt"
          ping -c 2 -W 1 "$TARGET_IP" >/dev/null 2>&1 || true
          {
            echo '=== NEIGHBOR / ARP ==='
            ip neigh show "$TARGET_IP" || true
            arp -an 2>/dev/null | grep -F "($TARGET_IP)" || true
          } | tee -a "$REPORT"

          ACTUAL_MAC="$(ip neigh show "$TARGET_IP" | awk '/lladdr/ {print tolower($5); exit}')"
          EXPECTED_MAC_NORM="$(printf '%s' "$EXPECTED_MAC" | tr '[:upper:]' '[:lower:]')"
          {
            echo "actual_mac=${ACTUAL_MAC:-NO-DETECTADA}"
            if [ -n "$EXPECTED_MAC_NORM" ]; then
              echo "expected_mac=$EXPECTED_MAC_NORM"
              if [ -n "$ACTUAL_MAC" ] && [ "$ACTUAL_MAC" != "$EXPECTED_MAC_NORM" ]; then
                echo 'WARN: la IP responde con una MAC distinta a la esperada.'
              else
                echo 'PASS: MAC coincide o aún no fue aprendida.'
              fi
            fi
          } | tee -a "$REPORT"

      - name: Auditar puertos del teléfono
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/grandstream-model-probe.txt"
          {
            echo '=== TCP SERVICE PROBE ==='
            if command -v nmap >/dev/null 2>&1; then
              nmap -n -Pn -sT -sV --version-light -p 23,80,443,5060,5061 "$TARGET_IP" || true
            else
              for p in 23 80 443 5060 5061; do
                timeout 2 bash -c "</dev/tcp/$TARGET_IP/$p" >/dev/null 2>&1 \
                  && echo "$p/tcp OPEN" || echo "$p/tcp closed-or-filtered"
              done
            fi
          } | tee -a "$REPORT"

      - name: Reproducir probeModel actual de Issabel
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/grandstream-model-probe.txt"

          echo '=== CURRENT ISSABEL GRANDSTREAM PROBE PATHS ===' | tee -a "$REPORT"

          BODY_MANAGER="$(curl -fsS --max-time 5 "http://$TARGET_IP/manager?action=product&time=0" 2>/dev/null || true)"
          PRODUCT="$(printf '%s' "$BODY_MANAGER" | sed -n 's/.*Product=\([A-Za-z0-9_-]*\).*/\1/p' | head -n1)"
          {
            echo '--- /manager?action=product&time=0 ---'
            printf '%s\n' "$BODY_MANAGER" | head -c 2000
            echo
            echo "product_pattern_result=${PRODUCT:-NO-DETECTADO}"
          } | tee -a "$REPORT"

          BODY_API="$(curl -fsS --max-time 5 "http://$TARGET_IP/cgi-bin/api.values.get?request=phone_model:1395" 2>/dev/null || true)"
          {
            echo '--- /cgi-bin/api.values.get?request=phone_model:1395 ---'
            printf '%s\n' "$BODY_API" | head -c 2000
            echo
          } | tee -a "$REPORT"

          if [ -n "$PRODUCT" ]; then
            echo "DETECTED_MODEL=$PRODUCT" | tee -a "$REPORT"
          else
            echo 'WARN: el patrón legacy Product= no detectó modelo.' | tee -a "$REPORT"
          fi

      - name: Auditar superficies HTTP/HTTPS sin autenticación
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/grandstream-model-probe.txt"
          for url in \
            "http://$TARGET_IP/" \
            "http://$TARGET_IP/manager?action=product&time=0" \
            "http://$TARGET_IP/cgi-bin/api.values.get?request=phone_model:1395" \
            "https://$TARGET_IP/"; do
            {
              echo "=== $url ==="
              curl -k -sS -D - --max-time 5 -o /tmp/grandstream-body "$url" 2>&1 | head -n 40 || true
              echo '--- BODY ---'
              head -c 2000 /tmp/grandstream-body 2>/dev/null || true
              echo
            } | tee -a "$REPORT"
          done

      - name: Capturar banner Telnet si existe
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/grandstream-model-probe.txt"
          {
            echo '=== TELNET BANNER ==='
            if timeout 2 bash -c "</dev/tcp/$TARGET_IP/23" >/dev/null 2>&1; then
              timeout 5 bash -c "exec 3<>/dev/tcp/$TARGET_IP/23; cat <&3" 2>/dev/null | head -c 4000 || true
              echo
            else
              echo 'Puerto 23 no accesible; Issabel debería caer al método HTTP.'
            fi
          } | tee -a "$REPORT"

      - name: Revisar lógica Grandstream instalada
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/grandstream-model-probe.txt"
          FILE=/usr/share/issabel/endpoint-classes/class/issabel/vendor/Grandstream.py
          {
            echo '=== INSTALLED GRANDSTREAM.PY PROBE LOGIC ==='
            if [ -r "$FILE" ]; then
              grep -nE 'def probeModel|manager.*product|Product=|telnet|phone_model' "$FILE" | head -n 160 || true
            else
              echo 'WARN: Grandstream.py no es legible por el runner.'
            fi
          } | tee -a "$REPORT"

      - name: Generar resumen visible
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/grandstream-model-probe.txt"
          ACTUAL_MAC="$(grep '^actual_mac=' "$REPORT" | tail -n1 | cut -d= -f2- || true)"
          DETECTED_MODEL="$(grep '^DETECTED_MODEL=' "$REPORT" | tail -n1 | cut -d= -f2- || true)"
          {
            echo '## Grandstream Model Detection Probe'
            echo
            echo '| Campo | Valor |'
            echo '|---|---|'
            echo "| IP | \`$TARGET_IP\` |"
            echo "| Modelo esperado | \`${EXPECTED_MODEL:-No especificado}\` |"
            echo "| Modelo detectado por lógica legacy | \`${DETECTED_MODEL:-NO-DETECTADO}\` |"
            echo "| MAC observada | \`${ACTUAL_MAC:-NO-DETECTADA}\` |"
            echo "| Resultado | \`$(if [ -n "$DETECTED_MODEL" ]; then echo PASS; else echo WARN; fi)\` |"
            echo
            if [ -z "$DETECTED_MODEL" ]; then
              echo '> El teléfono responde, pero el método actual de `Grandstream.py` no logró extraer el modelo. Esto apunta a una incompatibilidad de discovery/model detection con el firmware.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grandstream-model-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/grandstream-model-probe.txt
          if-no-files-found: error
          retention-days: 30

      - name: Resultado
        shell: bash
        run: |
          echo 'GRANDSTREAM-MODEL-PROBE-COMPLETE'
