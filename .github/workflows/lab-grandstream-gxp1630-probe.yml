name: 56 | Issabel Lab | Grandstream GXP1630 | Factory-State Discovery

on:
  push:
    branches: [Audit]
    paths: ['.github/workflows/lab-grandstream-gxp1630-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover and compare factory-state GXP1630
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Guard LAB
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = Audit
          test "$(id -un)" = github-runner
          test "$(hostname -s)" != cei-pbx02
      - name: Scan and identify GXP1630 without writes
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/test56-gxp1630-discovery.txt"
          SCAN="$RUNNER_TEMP/test56-nmap.txt"
          HOSTS="$RUNNER_TEMP/test56-hosts.txt"
          : > "$REPORT"
          nmap -sn 192.168.1.0/24 > "$SCAN"
          awk '/^Nmap scan report for / {ip=$NF; gsub(/[()]/,"",ip); print ip}' "$SCAN" | sort -Vu > "$HOSTS"
          echo 'scope=TEST56_GXP1630_FACTORY_STATE_DISCOVERY' | tee -a "$REPORT"
          echo 'network=192.168.1.0/24' | tee -a "$REPORT"
          MATCHES=0
          while IFS= read -r ip; do
            [ -n "$ip" ] || continue
            manager="$(curl -fsS --connect-timeout 1 --max-time 3 "http://$ip/manager?action=product&time=0" 2>/dev/null || true)"
            api="$(curl -fsS --connect-timeout 1 --max-time 3 "http://$ip/cgi-bin/api.values.get?request=phone_model:1395" 2>/dev/null || true)"
            if grep -Eqi 'GXP[[:space:]_-]*1630|GXP1630' <<<"$manager $api"; then
              mac="$(ip neigh show "$ip" | awk '/lladdr/ {print toupper($5); exit}')"
              firmware_body="$(curl -fsS --connect-timeout 1 --max-time 3 "http://$ip/cgi-bin/api.values.get?request=firmware_version:45" 2>/dev/null || true)"
              hardware_body="$(curl -fsS --connect-timeout 1 --max-time 3 "http://$ip/cgi-bin/api.values.get?request=hardware_version:1397" 2>/dev/null || true)"
              firmware="$(printf '%s' "$firmware_body" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
              hardware="$(printf '%s' "$hardware_body" | sed -nE 's/.*"hardware_version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' | head -n1)"
              MATCHES=$((MATCHES + 1))
              echo "match_${MATCHES}_ip=$ip" | tee -a "$REPORT"
              echo "match_${MATCHES}_mac=${mac:-UNKNOWN}" | tee -a "$REPORT"
              echo "match_${MATCHES}_model=GXP1630" | tee -a "$REPORT"
              echo "match_${MATCHES}_legacy_manager=$([ -n "$manager" ] && echo RESPONDS || echo NO_RESPONSE)" | tee -a "$REPORT"
              echo "match_${MATCHES}_values_api=$([ -n "$api" ] && echo RESPONDS || echo NO_RESPONSE)" | tee -a "$REPORT"
              echo "match_${MATCHES}_firmware=${firmware:-NOT_EXPOSED_UNAUTHENTICATED}" | tee -a "$REPORT"
              echo "match_${MATCHES}_hardware=${hardware:-NOT_EXPOSED_UNAUTHENTICATED}" | tee -a "$REPORT"
            fi
          done < "$HOSTS"
          echo "match_count=$MATCHES" | tee -a "$REPORT"
          test "$MATCHES" -eq 1
          echo 'TEST56-GXP1630-DISCOVERY=PASS' | tee -a "$REPORT"
      - name: Publish sanitized evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## Test 56 — GXP1630 factory-state discovery'
            [ -f "$RUNNER_TEMP/test56-gxp1630-discovery.txt" ] && cat "$RUNNER_TEMP/test56-gxp1630-discovery.txt" || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test56-gxp1630-discovery-${{ github.run_id }}
          path: ${{ runner.temp }}/test56-gxp1630-discovery.txt
          if-no-files-found: warn
          retention-days: 30

  authenticated-read:
    name: Compare GXP1625 authenticated read contract
    needs: discover
    runs-on: [self-hosted, Linux, X64, endpoint-lab, debian, grandstream-lab]
    timeout-minutes: 7
    env:
      PHONE_IP: 192.168.1.169
      PHONE_USERNAME: admin
      PHONE_PASSWORD: ${{ secrets.GRANDSTREAM_GXP_HTTP_DEFAULT_PASSWORD }}
      PBX_IP: 192.168.1.10
    steps:
      - uses: actions/checkout@v4
      - name: Guard exact factory-state target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = Audit
          test -n "$PHONE_PASSWORD"
          ping -c 1 -W 2 "$PHONE_IP" >/dev/null
          observed="$(ip neigh show "$PHONE_IP" | awk '/lladdr/ {print toupper($5); exit}')"
          test "$observed" = C0:74:AD:B4:AD:70
      - name: Run authenticated provisioning read without writes
        shell: bash
        run: |
          set -euo pipefail
          export REPORT_PATH="$RUNNER_TEMP/test56-gxp1630-auth-read.txt"
          python3 endpoint-lab/grandstream/g10-19e-provisioning-state-preflight.py
          grep -Fq 'login=SUCCESS' "$REPORT_PATH"
          grep -Fq 'read=SUCCESS' "$REPORT_PATH"
          grep -Fq 'phone_write=NO' "$REPORT_PATH"
          echo 'TEST56-GXP1630-AUTH-READ=PASS' | tee -a "$REPORT_PATH"
      - name: Publish sanitized authenticated evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## Test 56 — GXP1630 authenticated read'
            [ -f "$RUNNER_TEMP/test56-gxp1630-auth-read.txt" ] && cat "$RUNNER_TEMP/test56-gxp1630-auth-read.txt" || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized authenticated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test56-gxp1630-auth-read-${{ github.run_id }}
          path: ${{ runner.temp }}/test56-gxp1630-auth-read.txt
          if-no-files-found: warn
          retention-days: 30
