name: G10-19D | Issabel Lab | Grandstream TFTP Repair & Proof | Controlled Test

on:
  workflow_dispatch:
  push:
    branches: [Audit]
    paths:
      - '.github/workflows/lab-grandstream-g10-19d-tftp-repair-proof.yml'

permissions:
  contents: read

jobs:
  g10_19d:
    name: GXP1625 TFTP repair and proof
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify lab branch and runner
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'Audit'
          test "$(id -un)" = 'github-runner'

      - name: Controlled xinetd restart and TFTP proof
        shell: bash
        run: |
          set -u
          REPORT="$RUNNER_TEMP/g10-19d-tftp-repair-proof.txt"
          CFG='/tftpboot/cfgc074ade86609'
          : > "$REPORT"
          chmod 600 "$REPORT"
          log(){ printf '%s\n' "${1:-}" | tee -a "$REPORT"; }

          log '=== G10-19D TFTP REPAIR AND PROOF ==='
          log 'scope=LAB_CONTROLLED'
          log 'db_write=NO'
          log 'live_pbx_code_write=NO'
          log 'phone_write=NO'
          log 'firewall_change=NO'
          log 'selinux_change=NO'
          log 'service_change=XINETD_RESTART_ONLY'
          log 'cfg_payload_dumped=NO'

          if ss -lun 2>/dev/null | awk '{print $5}' | grep -Eq '(^|:)69$'; then log 'udp69_before=YES'; else log 'udp69_before=NO'; fi

          if sudo -n systemctl restart xinetd 2>/dev/null; then
            log 'xinetd_restart=SUCCESS'
          else
            log 'xinetd_restart=DENIED_OR_FAILED'
          fi
          sleep 1
          if ss -lun 2>/dev/null | awk '{print $5}' | grep -Eq '(^|:)69$'; then log 'udp69_after=YES'; else log 'udp69_after=NO'; fi
          log "xinetd_active=$(systemctl is-active xinetd 2>/dev/null || true)"

          if [ -r "$CFG" ]; then
            log "cfg_source_size=$(stat -c %s "$CFG")"
            log "cfg_source_sha256=$(sha256sum "$CFG" | awk '{print $1}')"
          else
            log 'cfg_source=UNREADABLE_OR_MISSING'
          fi

          if ss -lun 2>/dev/null | awk '{print $5}' | grep -Eq '(^|:)69$' && [ -r "$CFG" ]; then
            python3 - <<'PY' "$REPORT" "$CFG"
import hashlib, os, socket, struct, sys
report, source = sys.argv[1], sys.argv[2]
server=('127.0.0.1',69)
name=os.path.basename(source).encode()
req=struct.pack('!H',1)+name+b'\0octet\0'
s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(3); s.sendto(req,server)
data=bytearray(); expected=1; peer=None
status='FAILED'
try:
    while True:
        pkt, addr=s.recvfrom(2048)
        op=struct.unpack('!H',pkt[:2])[0]
        if op==5: break
        if op!=3: break
        block=struct.unpack('!H',pkt[2:4])[0]
        if block!=expected: break
        peer=addr
        chunk=pkt[4:]; data.extend(chunk)
        s.sendto(struct.pack('!HH',4,block),addr)
        if len(chunk)<512:
            status='SUCCESS'; break
        expected=(expected+1)&0xffff
except Exception:
    pass
src=open(source,'rb').read()
with open(report,'a') as f:
    f.write('tftp_rrq=%s\n'%status)
    if status=='SUCCESS':
        f.write('tftp_received_size=%d\n'%len(data))
        f.write('tftp_sha_match=%s\n'%('YES' if hashlib.sha256(data).digest()==hashlib.sha256(src).digest() else 'NO'))
PY
          else
            log 'tftp_rrq=SKIPPED_NO_LISTENER_OR_CFG'
          fi

          if grep -Fq 'udp69_after=YES' "$REPORT" && grep -Fq 'tftp_rrq=SUCCESS' "$REPORT" && grep -Fq 'tftp_sha_match=YES' "$REPORT"; then
            log 'diagnostic=TFTP_READY_AND_CFG_PROVEN'
            log 'next_activity=G10-19E_BOOTSTRAP_CONTROLLED'
          elif grep -Fq 'xinetd_restart=DENIED_OR_FAILED' "$REPORT"; then
            log 'diagnostic=XINETD_RESTART_NOT_AUTHORIZED_OR_FAILED'
            log 'next_activity=G10-19D2_PRIVILEGED_REPAIR'
          else
            log 'diagnostic=TFTP_STILL_NOT_LISTENING_AFTER_RESTART'
            log 'next_activity=G10-19D2_XINETD_BIND_DIAGNOSTIC'
          fi
          log 'G10-19D-COMPLETE'

      - name: Job summary
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/g10-19d-tftp-repair-proof.txt"
          [ -f "$REPORT" ] && grep -E '^(udp69_|xinetd_|tftp_|diagnostic=|next_activity=|G10-19D-COMPLETE)' "$REPORT" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g10-19d-tftp-repair-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/g10-19d-tftp-repair-proof.txt
          if-no-files-found: error
          retention-days: 30
