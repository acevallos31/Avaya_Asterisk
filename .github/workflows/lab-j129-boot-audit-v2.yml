name: Issabel Lab J129 Boot Audit v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot-audit:
    name: Auditoría de arranque Avaya J129 en LAB
    runs-on: [self-hosted, Linux, X64, issabel-lab]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verificar identidad del runner
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(id -un)@$(hostname)"
          test "$(id -un)" = "github-runner"

      - name: Sincronizar helper restringido
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/sbin/avaya-j129-helper-sync
          sudo -n -l | grep -F '/usr/local/sbin/avaya-j129-helper-sync'
          sudo /usr/local/sbin/avaya-j129-helper-sync

      - name: Verificar provisioning generado
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/avaya-j129-lab-deploy inspect-provisioning

      - name: Probar exposición HTTP HTTPS y conectividad
        shell: bash
        run: |
          set -euo pipefail
          PHONE_IP='192.168.1.171'
          PBX_IP='192.168.1.169'
          echo '=== RED HACIA J129 ==='
          ping -c 2 -W 1 "$PHONE_IP" || true
          ip neigh show "$PHONE_IP" || true
          echo '=== PUERTOS PBX ==='
          ss -lntup 2>/dev/null | grep -E ':(69|80|443|5060)\b' || true
          echo '=== PRUEBAS HTTP ==='
          for path in /46xxsettings.txt /c81fea9b650d.txt /tftpboot/46xxsettings.txt /tftpboot/c81fea9b650d.txt; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "http://${PBX_IP}${path}" || true)"
            echo "HTTP ${path} -> ${code:-ERROR}"
          done
          echo '=== PRUEBAS HTTPS ==='
          for path in /46xxsettings.txt /c81fea9b650d.txt /tftpboot/46xxsettings.txt /tftpboot/c81fea9b650d.txt; do
            code="$(curl -k -sS -o /dev/null -w '%{http_code}' --max-time 5 "https://${PBX_IP}${path}" || true)"
            echo "HTTPS ${path} -> ${code:-ERROR}"
          done
          echo 'J129-BOOT-V2-AUDIT-PASS'

      - name: Resultado
        shell: bash
        run: |
          set -euo pipefail
          echo 'J129-BOOT-V2-WORKFLOW-PASS'
