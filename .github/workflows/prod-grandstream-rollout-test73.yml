name: 73 | Ceiba Production | Grandstream Support | Controlled Server Rollout

on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/endpoint-configurator/**'
      - '.github/workflows/prod-grandstream-rollout-test73.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'COMPARE-GRANDSTREAM-PROD (read-only) or DEPLOY-GRANDSTREAM-PROD'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: grandstream-support-ceiba-production
  cancel-in-progress: false

jobs:
  static-audit:
    name: Static rollout audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate reviewed production payload
        shell: bash
        run: |
          set -euo pipefail
          helper='deploy/endpoint-configurator/bin/grandstream-prod-deploy'
          sync='deploy/endpoint-configurator/bin/issabel-prod-helper-sync'
          bootstrap='deploy/endpoint-configurator/bin/bootstrap-prod-helper-sync'
          patcher='deploy/endpoint-configurator/bin/grandstream-vendor-patch.py'
          auth='deploy/endpoint-configurator/bin/grp26xx-prod-auth-read.py'
          sql='deploy/endpoint-configurator/sql/grandstream-prod-catalog.sql'
          sudoers='deploy/endpoint-configurator/sudoers/issabel-grandstream-prod'
          stock='usr/share/issabel/endpoint-classes/class/issabel/vendor/Grandstream.py'
          workflow='.github/workflows/prod-grandstream-rollout-test73.yml'

          bash -n "$helper" "$sync" "$bootstrap"
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile "$patcher" "$auth"
          grep -Fq "EXPECTED_HOST='cei-pbx02'" "$helper"
          grep -Fq "RUNNER_USER='github-runner-prod'" "$helper"
          grep -Fq "CANDIDATE_ROOT='/opt/actions-runner-prod/_work/Avaya_Asterisk/Avaya_Asterisk/_prod_helper_candidate'" "$sync"
          grep -Fq "RUNNER_USER='github-runner-prod'" "$sync"
          grep -Fq "EXPECTED_HOST='cei-pbx02'" "$sync"
          grep -Fq "REMOTE_API_BASE='https://api.github.com/repos/acevallos31/Avaya_Asterisk/contents'" "$sync"
          grep -Fq 'require_remote_main_file' "$sync"
          grep -Fq 'TEST73-SIP-ADDR-PORT-NORMALIZATION' "$sync"
          ! grep -Fq 'candidate checkout missing .git' "$sync"
          ! grep -Fq "BLOB_HELPER='" "$sync"
          grep -Fq "SYNC_BLOB='a773d73636d4042ffd32775a993ab54b0e2a1b48'" "$bootstrap"
          grep -Fq 'C0:74:AD:E8:66:06' "$helper"
          grep -Fq 'EC:74:D7:5D:2C:F5' "$helper"
          grep -Fq 'EC:74:D7:65:FE:08' "$helper"
          grep -Fq $'GRP2602G\tEC:74:D7:65:FE:08\t10.3.40.43\t4452' "$helper"
          ! grep -Fq 'issabel-helper detect_endpoints' "$helper"
          grep -Fq 'GRANDSTREAM-PROD-DISCOVERY-SKIPPED=PASS' "$helper"
          grep -Fq "'GRP2601P','GRP2601P',2" "$sql"
          grep -Fq "'GRP2602G','GRP2602G',4" "$sql"
          grep -Fq "property_value='4'" "$sql"
          grep -Fq 'configure-grp2602g CONFIGURE-GRP2602G-4452' "$sudoers"
          grep -Fq 'COMPARE-GRANDSTREAM-PROD' "$workflow"
          grep -Fq 'TEST73-DISCOVERY-DEFERRED=PASS' "$workflow"
          grep -Fq 'LAB_REFERENCE_GRP2601P_TEST66=34677554254' "$workflow"
          grep -Fq 'TEST73-DEEP-READONLY-PARITY=PASS' "$workflow"
          grep -Fq 'VENDOR-AST label=' "$workflow"
          grep -Fq 'STALE-J129-LOCATION' "$workflow"
          grep -Fq 'ref: Audit' "$workflow"
          grep -Fq "getattr(child.args, 'posonlyargs', [])" "$workflow"

          tmp="$(mktemp)"
          python3 "$patcher" "$stock" "$tmp"
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile "$tmp"
          grep -Fq 'CEIBA-GRANDSTREAM-PROD-V1' "$tmp"
          grep -Fq 'def _loginGRP26xx' "$tmp"
          grep -Fq 'def _enableStaticProvisioning_GRP26xx' "$tmp"
          grep -Fq "'username': self._http_username" "$tmp"
          rm -f "$tmp" "${tmp}c"
          echo 'TEST73-STATIC-PASS'

  production-rollout:
    if: github.event_name == 'workflow_dispatch'
    name: Ceiba Grandstream LAB parity / controlled rollout
    needs: static-audit
    runs-on: [self-hosted, Linux, X64, j129-production, cei-pbx02]
    timeout-minutes: 20
    env:
      PROD_SYNC: /usr/local/sbin/issabel-prod-helper-sync
      PROD_HELPER: /usr/local/sbin/issabel-grandstream-prod
      J129_HELPER: /usr/local/sbin/avaya-j129-prod-validation
      PROD_CANDIDATE: /opt/actions-runner-prod/_work/Avaya_Asterisk/Avaya_Asterisk/_prod_helper_candidate
      LAB_REFERENCE_ROOT: /opt/actions-runner-prod/_work/Avaya_Asterisk/Avaya_Asterisk/_lab_reference
      LAB_REFERENCE_GXP1625_TEST55: '34543757258'
      LAB_REFERENCE_GRP2601P_TEST63: '34620390872'
      LAB_REFERENCE_GRP2601P_TEST66: '34677554254'
    steps:
      - name: Guard estricto de producción
        env:
          CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'main'
          case "$CONFIRM" in
            COMPARE-GRANDSTREAM-PROD|DEPLOY-GRANDSTREAM-PROD) ;;
            *) echo "invalid confirmation token" >&2; exit 2 ;;
          esac
          test "$(id -un)" = 'github-runner-prod'
          test "$(hostname -s)" = 'cei-pbx02'
          echo "test73_mode=$CONFIRM"
          echo 'preserve_gxp1625=4450'
          echo 'preserve_grp2601p=4453'
          echo 'preserve_grp2602g=4452'
          echo 'phone_write=NO'
          echo 'TEST73-PROD-RUNNER-GUARD-PASS'

      - name: Checkout reviewed main candidate for permanent synchronizer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: _prod_helper_candidate
          clean: true
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout known-good LAB reference
        if: inputs.confirm == 'COMPARE-GRANDSTREAM-PROD'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: Audit
          path: _lab_reference
          clean: true
          persist-credentials: false
          fetch-depth: 1

      - name: Verify permanent production sync foundation
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/test73-helper-foundation.txt"
          : > "$REPORT"
          chmod 0600 "$REPORT"
          echo 'scope=TEST73_PERMANENT_HELPER_SYNC' | tee -a "$REPORT"
          echo 'production_runtime_write=NO' | tee -a "$REPORT"
          echo 'endpointconfig_write=NO' | tee -a "$REPORT"
          echo 'phone_write=NO' | tee -a "$REPORT"
          test "$PROD_CANDIDATE" = "$GITHUB_WORKSPACE/_prod_helper_candidate"
          if [ ! -x "$PROD_SYNC" ]; then
            echo 'TEST73-PROD-SYNC-BOOTSTRAP=REQUIRED' | tee -a "$REPORT"
            exit 3
          fi
          meta="$(stat -c '%U:%G:%a' "$PROD_SYNC")"
          echo "prod_sync_meta=$meta" | tee -a "$REPORT"
          test "$meta" = 'root:root:755'
          sudo -n -l "$PROD_SYNC" >/dev/null
          test -x "$J129_HELPER"
          echo 'TEST73-PERMANENT-HELPER-SYNC=READY' | tee -a "$REPORT"

      - name: Sync reviewed Grandstream helper payload
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/test73-helper-foundation.txt"
          sudo -n "$PROD_SYNC" | tee -a "$REPORT"
          grep -Fq 'PROD-HELPER-SYNC-PAYLOAD-AUDIT-PASS' "$REPORT"
          grep -Fq 'PROD-HELPER-SYNC-SIP-PORT-NORMALIZATION=PASS' "$REPORT"
          grep -Fq 'PROD-HELPER-SYNC-GRANDSTREAM=PASS' "$REPORT"
          grep -Fq 'endpointconfig_write=NO' "$REPORT"
          grep -Fq 'phone_write=NO' "$REPORT"
          test -x "$PROD_HELPER"
          test "$(stat -c '%U:%G:%a' "$PROD_HELPER")" = 'root:root:755'
          echo 'TEST73-GRANDSTREAM-HELPER-SYNC=PASS' | tee -a "$REPORT"

      - name: Production preflight and LAB parity evidence
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/test73-grandstream-prod.txt"
          FLEET="$RUNNER_TEMP/test73-j129-fleet.txt"
          : > "$REPORT"
          chmod 0600 "$REPORT"
          sudo -n "$PROD_HELPER" preflight | tee -a "$REPORT"
          sudo -n "$J129_HELPER" fleet-audit | tee "$FLEET"
          grep -Fq 'GRANDSTREAM-PROD-PREFLIGHT-PASS' "$REPORT"
          grep -Fq 'GRANDSTREAM-PROD-CANARY-EXTENSION-GUARD-PASS' "$REPORT"
          grep -Fq 'GRANDSTREAM-PROD-STALE-COLLISION-GUARD-PASS' "$REPORT"
          grep -Fq 'J129-PROD-FLEET-AUDIT-PASS' "$FLEET"
          grep -Fq 'phone_write=NO' "$REPORT"
          {
            echo "LAB_REFERENCE_GXP1625_TEST55=$LAB_REFERENCE_GXP1625_TEST55"
            echo "LAB_REFERENCE_GRP2601P_TEST63=$LAB_REFERENCE_GRP2601P_TEST63"
            echo "LAB_REFERENCE_GRP2601P_TEST66=$LAB_REFERENCE_GRP2601P_TEST66"
            echo 'lab_grp2601p_max_accounts=2'
            echo 'lab_grp2601p_discovery_account_count=0'
            echo 'ceiba_preserve_gxp1625_extension=4450'
            echo 'ceiba_preserve_grp2601p_extension=4453'
            echo 'ceiba_preserve_grp2602g_extension=4452'
            grep -E '^(CANARY-|STALE-ENDPOINT|GRANDSTREAM-PROD-CATALOG-BASE-PASS|GRANDSTREAM-PROD-VENDOR-STATE=)' "$REPORT" || true
            grep -E '^(AVAYA-ENDPOINT|J129-PROD-FLEET-AUDIT-PASS)' "$FLEET" || true
            echo 'TEST73-LAB-CEIBA-PARITY-EVIDENCE=PASS'
          } | tee "$RUNNER_TEMP/test73-lab-ceiba-parity.txt"

      - name: Deep read-only vendor and stale J129 comparison
        if: inputs.confirm == 'COMPARE-GRANDSTREAM-PROD'
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/test73-deep-compare.txt"
          CEIBA_VENDOR='/usr/share/issabel/endpoint-classes/class/issabel/vendor/Grandstream.py'
          STOCK_VENDOR="$PROD_CANDIDATE/usr/share/issabel/endpoint-classes/class/issabel/vendor/Grandstream.py"
          PATCHER="$PROD_CANDIDATE/deploy/endpoint-configurator/bin/grandstream-vendor-patch.py"
          TARGET_VENDOR="$RUNNER_TEMP/test73-target-grandstream.py"
          : > "$OUT"
          chmod 0600 "$OUT"
          test -r "$CEIBA_VENDOR"
          test -r "$STOCK_VENDOR"
          test -r "$PATCHER"
          test "$LAB_REFERENCE_ROOT" = "$GITHUB_WORKSPACE/_lab_reference"
          test -d "$LAB_REFERENCE_ROOT"

          python3 "$PATCHER" "$STOCK_VENDOR" "$TARGET_VENDOR"
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile "$TARGET_VENDOR"

          python3 -B - "$CEIBA_VENDOR" "$STOCK_VENDOR" "$TARGET_VENDOR" <<'PY' | tee -a "$OUT"
          import ast
          import hashlib
          import pathlib
          import sys

          labels = ('CEIBA', 'STOCK_REPO', 'TARGET_PATCH')
          interesting = ('login', 'auth', 'config', 'reboot', 'xml', 'http', 'request', 'provision')
          all_maps = {}
          for label, filename in zip(labels, sys.argv[1:]):
              path = pathlib.Path(filename)
              data = path.read_bytes()
              tree = ast.parse(data.decode('utf-8'), filename=str(path))
              methods = {}
              classes = []
              for node in tree.body:
                  if isinstance(node, ast.ClassDef):
                      classes.append(node.name)
                      for child in node.body:
                          if isinstance(child, (ast.FunctionDef, ast.AsyncFunctionDef)):
                              low = child.name.lower()
                              if any(token in low for token in interesting):
                                  key = f'{node.name}.{child.name}'
                                  dump = ast.dump(child, annotate_fields=True, include_attributes=False)
                                  digest = hashlib.sha256(dump.encode('utf-8')).hexdigest()
                                  argc = len(getattr(child.args, 'posonlyargs', [])) + len(child.args.args)
                                  methods[key] = digest
                                  print(f'VENDOR-AST label={label} method={key} argc={argc} ast_sha256={digest}')
              all_maps[label] = methods
              print(f'VENDOR-FILE label={label} sha256={hashlib.sha256(data).hexdigest()} class_count={len(classes)} method_count={len(methods)}')
              for name in sorted(classes):
                  print(f'VENDOR-CLASS label={label} name={name}')

          keys = sorted(set().union(*(set(m) for m in all_maps.values())))
          for key in keys:
              ceiba = all_maps['CEIBA'].get(key)
              stock = all_maps['STOCK_REPO'].get(key)
              target = all_maps['TARGET_PATCH'].get(key)
              if ceiba is None:
                  relation = 'CEIBA_MISSING'
              elif ceiba == target:
                  relation = 'CEIBA_EQUALS_TARGET'
              elif ceiba == stock:
                  relation = 'CEIBA_EQUALS_STOCK'
              else:
                  relation = 'CEIBA_DIFFERS'
              print(f'VENDOR-METHOD-COMPARE method={key} relation={relation} stock_present={"YES" if stock else "NO"} target_present={"YES" if target else "NO"}')
          print('TEST73-VENDOR-AST-FINGERPRINT=PASS')
          PY

          for marker in \
            'G10-19H8J-FINAL-NATIVE-GXP16XX' \
            'G10-19H6-INTEGRATED-XML-GENERATOR' \
            'G10-19H8F0-SAFE-ERROR-LOGGING' \
            'GRP26XX-NONCE-CONFIG-UPDATE'; do
            matches="$(grep -RIl --exclude-dir=.git -- "$marker" "$LAB_REFERENCE_ROOT" 2>/dev/null || true)"
            count="$(printf '%s\n' "$matches" | sed '/^$/d' | wc -l | tr -d ' ')"
            echo "LAB-MARKER marker=$marker file_count=$count" | tee -a "$OUT"
            if [ "$count" -gt 0 ]; then
              printf '%s\n' "$matches" | sed '/^$/d' | sed "s#^$LAB_REFERENCE_ROOT/##" | head -n 5 | while IFS= read -r path; do
                echo "LAB-MARKER-FILE marker=$marker path=$path" | tee -a "$OUT"
              done
            fi
          done

          # Same read-only L2 refresh method already proven by Test 72.
          if command -v ping >/dev/null 2>&1; then
            seq 1 254 | xargs -P 48 -I{} sh -c 'ping -c 1 -W 1 "10.3.40.{}" >/dev/null 2>&1 || true'
          fi
          ip neigh show > "$RUNNER_TEMP/test73-neigh.txt"
          stale_ip="$(awk 'BEGIN{target="C8:1F:EA:C3:D5:8E"} {for(i=1;i<=NF;i++) if($i=="lladdr" && toupper($(i+1))==target){print $1; exit}}' "$RUNNER_TEMP/test73-neigh.txt")"
          if [ -n "$stale_ip" ]; then
            echo "STALE-J129-LOCATION mac=C8:1F:EA:C3:D5:8E state=FOUND ip=$stale_ip" | tee -a "$OUT"
          else
            echo 'STALE-J129-LOCATION mac=C8:1F:EA:C3:D5:8E state=NOT_FOUND_ON_L2' | tee -a "$OUT"
          fi
          echo 'production_runtime_write=NO' | tee -a "$OUT"
          echo 'endpointconfig_write=NO' | tee -a "$OUT"
          echo 'phone_write=NO' | tee -a "$OUT"
          echo 'TEST73-DEEP-READONLY-PARITY=PASS' | tee -a "$OUT"
          rm -f "$TARGET_VENDOR" "${TARGET_VENDOR}c"

      - name: Complete read-only LAB vs Ceiba comparison
        if: inputs.confirm == 'COMPARE-GRANDSTREAM-PROD'
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/test73-grandstream-prod.txt"
          DEEP="$RUNNER_TEMP/test73-deep-compare.txt"
          grep -Fq 'production_runtime_write=NO' "$REPORT"
          grep -Fq 'endpointconfig_write=NO' "$REPORT"
          grep -Fq 'phone_write=NO' "$REPORT"
          grep -Fq 'TEST73-VENDOR-AST-FINGERPRINT=PASS' "$DEEP"
          grep -Fq 'TEST73-DEEP-READONLY-PARITY=PASS' "$DEEP"
          grep -Fq 'phone_write=NO' "$DEEP"
          echo 'TEST73-LAB-CEIBA-COMPARE=PASS' | tee -a "$REPORT"

      - name: Confirm discovery is deferred for controlled server rollout
        if: inputs.confirm == 'DEPLOY-GRANDSTREAM-PROD'
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/test73-grandstream-prod.txt"
          if grep -Eq '^STALE-ENDPOINT ' "$REPORT"; then
            echo 'stale_endpoint_evidence=PRESENT_READ_ONLY' | tee -a "$REPORT"
          else
            echo 'stale_endpoint_evidence=NONE' | tee -a "$REPORT"
          fi
          echo 'endpoint_discovery=DEFERRED_MANUAL_CONTROLLED' | tee -a "$REPORT"
          echo 'endpointconfig_write=NO' | tee -a "$REPORT"
          echo 'phone_write=NO' | tee -a "$REPORT"
          echo 'TEST73-DISCOVERY-DEFERRED=PASS' | tee -a "$REPORT"

      - name: Controlled server rollout without global discovery
        if: inputs.confirm == 'DEPLOY-GRANDSTREAM-PROD'
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/test73-grandstream-prod.txt"
          sudo -n "$PROD_HELPER" install DEPLOY-GRANDSTREAM-PROD | tee -a "$REPORT"
          grep -Fq 'GRANDSTREAM-PROD-CONTROLLED-INSTALL=PASS' "$REPORT"
          grep -Fq 'GRANDSTREAM-PROD-DISCOVERY-SKIPPED=PASS' "$REPORT"
          grep -Fq 'endpoint_discovery=DEFERRED_MANUAL_CONTROLLED' "$REPORT"
          grep -Fq 'phone_write=NO' "$REPORT"

      - name: Verify Grandstream and J129 fleet after rollout
        if: inputs.confirm == 'DEPLOY-GRANDSTREAM-PROD'
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/test73-grandstream-prod.txt"
          sudo -n "$PROD_HELPER" verify | tee -a "$REPORT"
          sudo -n "$J129_HELPER" fleet-audit | tee "$RUNNER_TEMP/test73-j129-fleet-after.txt"
          grep -Fq 'GRANDSTREAM-PROD-VERIFY-PASS' "$REPORT"
          grep -Fq 'GRANDSTREAM-PROD-CANARY-EXTENSION-GUARD-PASS' "$REPORT"
          grep -Fq 'endpoint_discovery=DEFERRED_MANUAL_CONTROLLED' "$REPORT"
          grep -Fq 'J129-PROD-FLEET-AUDIT-PASS' "$RUNNER_TEMP/test73-j129-fleet-after.txt"
          echo 'preserved_extension_gxp1625=4450' | tee -a "$REPORT"
          echo 'preserved_extension_grp2601p=4453' | tee -a "$REPORT"
          echo 'preserved_extension_grp2602g=4452' | tee -a "$REPORT"
          echo 'phone_write=NO' | tee -a "$REPORT"
          echo 'TEST73-PROD-GRANDSTREAM-SERVER-ROLLOUT=PASS' | tee -a "$REPORT"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test73-grandstream-prod-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/test73-helper-foundation.txt
            ${{ runner.temp }}/test73-grandstream-prod.txt
            ${{ runner.temp }}/test73-lab-ceiba-parity.txt
            ${{ runner.temp }}/test73-deep-compare.txt
            ${{ runner.temp }}/test73-neigh.txt
            ${{ runner.temp }}/test73-j129-fleet.txt
            ${{ runner.temp }}/test73-j129-fleet-after.txt
          if-no-files-found: ignore
          retention-days: 90
