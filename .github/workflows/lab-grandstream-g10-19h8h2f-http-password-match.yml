name: G10-19H8H2F | Issabel Lab | Effective HTTP Password Match

on:
  push:
    branches: [Audit]
    paths:
      - 'deploy/grandstream/prepare-g10-19h8h2f-http-password-match-helper.py'
      - '.github/workflows/lab-grandstream-g10-19h8h2f-http-password-match.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PHONE_PASSWORD: ${{ secrets.GRANDSTREAM_GXP1625_HTTP_PASSWORD }}

jobs:
  compare:
    name: Compare Issabel effective HTTP password with known-good lab secret
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Prepare restricted read-only comparison
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'Audit'
          test -n "$PHONE_PASSWORD"
          python3 -B deploy/grandstream/prepare-g10-19h8h2f-http-password-match-helper.py
          bash -n deploy/j129/avaya-j129-lab-deploy
          OUT="$(sudo -n /usr/local/sbin/avaya-j129-helper-sync)"
          printf '%s\n' "$OUT"
          grep -Fq 'HELPER-SYNC-ALL-PASS' <<<"$OUT"

      - name: Compare without exposing password
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/g10-19h8h2f.txt"
          printf '%s\n' "$PHONE_PASSWORD" \
            | sudo -n /usr/local/sbin/avaya-j129-lab-deploy compare-grandstream-http-password \
            | tee "$REPORT"
          grep -Fq 'G10-19H8H2F-COMPLETE=YES' "$REPORT"
          ! grep -Fq "$PHONE_PASSWORD" "$REPORT"
          {
            echo '## G10-19H8H2F — Effective HTTP password match'
            grep -E '^(scope=|db_write=|phone_write=|secret_values_logged=|effective_http_password_source=|endpoint_override_count=|model_default_count=|effective_http_password_matches_lab_secret=|diagnostic=|G10-19H8H2F-COMPLETE=)' "$REPORT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g10-19h8h2f-${{ github.run_id }}
          path: ${{ runner.temp }}/g10-19h8h2f.txt
          if-no-files-found: warn
          retention-days: 30
