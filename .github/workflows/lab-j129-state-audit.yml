name: Issabel Lab J129 State Audit

on:
  workflow_dispatch:
    inputs:
      estado:
        description: Estado esperado del J129
        required: true
        default: configured
        type: choice
        options:
          - configured
          - removed

permissions:
  contents: read

jobs:
  audit:
    name: Auditar DB, provisioning y registro SIP del J129
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verificar identidad del runner
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(id -un)@$(hostname)"
          test "$(id -un)" = "github-runner"

      - name: Sincronizar helper restringido
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/sbin/avaya-j129-helper-sync
          sudo -n -l | grep -F '/usr/local/sbin/avaya-j129-helper-sync'
          sudo /usr/local/sbin/avaya-j129-helper-sync
          sudo -n -l | grep -F '/usr/local/sbin/avaya-j129-lab-deploy'

      - name: Auditar base de datos
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/avaya-j129-lab-deploy inspect-db

      - name: Auditar provisioning
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/avaya-j129-lab-deploy inspect-provisioning

      - name: Auditar registro SIP
        id: sip
        shell: bash
        env:
          EXPECTED_STATE: ${{ inputs.estado }}
        run: |
          set -uo pipefail
          set +e
          output="$(sudo /usr/local/sbin/avaya-j129-lab-deploy inspect-sip-registration 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"

          if [ "$EXPECTED_STATE" = "configured" ]; then
            if [ "$rc" -ne 0 ]; then
              echo 'ERROR: se esperaba J129 configurado y registrado.' >&2
              exit "$rc"
            fi
            echo 'SIP-STATE-CONFIGURED-PASS'
          else
            if [ "$rc" -eq 0 ]; then
              echo 'OBSERVACION: el teléfono sigue registrado aunque Endpoint Configurator fue removido.'
            elif printf '%s\n' "$output" | grep -F 'J129 no tiene cuenta asignada en Endpoint Configurator' >/dev/null; then
              echo 'OBSERVACION: Endpoint Configurator ya no conserva la asociación de cuenta del J129.'
            else
              echo 'OBSERVACION: registro SIP no verificable con la asociación estándar después de Remove.'
            fi
            echo 'SIP-STATE-REMOVED-OBSERVED'
          fi

      - name: Resultado
        shell: bash
        env:
          EXPECTED_STATE: ${{ inputs.estado }}
        run: |
          echo "J129-STATE-AUDIT-PASS estado=${EXPECTED_STATE}"
