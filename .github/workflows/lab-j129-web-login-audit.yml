name: Issabel Lab J129 Web Login Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Auditar login web publico del J129
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verificar identidad del runner
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(id -un)@$(hostname)"
          test "$(id -un)" = "github-runner"

      - name: Ejecutar auditoria read-only del login web
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/lab/j129_web_login_audit.py
