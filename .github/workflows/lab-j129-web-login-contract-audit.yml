name: Issabel Lab J129 Web Login Contract Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Auditar contrato real de login web J129
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verificar identidad del runner
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(id -un)@$(hostname)"
          test "$(id -un)" = "github-runner"
          test "$(hostname -s)" = "issabel"

      - name: Ejecutar auditoria read-only del login
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/lab/j129_web_login_contract_audit.py
