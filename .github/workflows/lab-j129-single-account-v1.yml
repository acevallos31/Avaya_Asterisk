name: 08 | Issabel Lab | J129 Single Account V1 | Apply & Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single_account_v1:
    name: Limitar J129 v1 a una cuenta SIP y auditar
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verificar identidad del runner
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(id -un)@$(hostname)"
          test "$(id -un)" = "github-runner"

      - name: Preparar helper para limite v1
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/j129/prepare-single-account-v1.py
          bash -n deploy/j129/avaya-j129-lab-deploy

      - name: Sincronizar helper restringido
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/sbin/avaya-j129-helper-sync
          sudo -n -l | grep -F '/usr/local/sbin/avaya-j129-helper-sync'
          sudo /usr/local/sbin/avaya-j129-helper-sync
          sudo -n -l | grep -F '/usr/local/sbin/avaya-j129-lab-deploy'

      - name: Aplicar limite de una cuenta SIP para J129 v1
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/avaya-j129-lab-deploy apply-v1-single-account

      - name: Auditar metadata resultante
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/avaya-j129-lab-deploy inspect-db

      - name: Resultado
        shell: bash
        run: |
          echo 'J129-SINGLE-ACCOUNT-V1-WORKFLOW-PASS'
