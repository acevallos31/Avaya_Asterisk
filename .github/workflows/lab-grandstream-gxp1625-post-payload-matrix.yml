name: G10-17I | Issabel Lab | GXP1625 POST Payload Matrix | Controlled Test

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN-G10-17I to allow same-value P208 write variants'
        required: true
        type: string

permissions:
  contents: read

jobs:
  g10_17i:
    name: Grandstream GXP1625 controlled POST payload matrix
    runs-on: [self-hosted, linux]
    env:
      GRANDSTREAM_HTTP_USERNAME: admin
      GRANDSTREAM_HTTP_PASSWORD: ${{ secrets.GRANDSTREAM_GXP1625_HTTP_PASSWORD }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Audit branch, runner and confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'Audit'
          test "$(id -un)" = 'github-runner'
          test "$CONFIRMATION" = 'RUN-G10-17I'
          test -n "${GRANDSTREAM_HTTP_PASSWORD:-}"
          echo 'credential_source=GITHUB-ACTIONS-SECRET'
          echo 'credential_value=NOT-PRINTED'

      - name: Validate diagnostic script
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/grandstream-gxp1625-post-payload-matrix.py
          grep -Fq 'SID_THEN_P208' scripts/grandstream-gxp1625-post-payload-matrix.py
          grep -Fq 'phone_write=SAME-VALUE-P208-ONLY' scripts/grandstream-gxp1625-post-payload-matrix.py

      - name: Run G10-17I controlled payload matrix
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/g10-17i-grandstream-post-payload-matrix.txt"
          python3 scripts/grandstream-gxp1625-post-payload-matrix.py "$REPORT"
          grep -Fq 'G10-17I-COMPLETE' "$REPORT"
          ! grep -Fq "$GRANDSTREAM_HTTP_PASSWORD" "$REPORT"

      - name: Job summary
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/g10-17i-grandstream-post-payload-matrix.txt"
          {
            echo '## G10-17I Grandstream GXP1625 POST payload matrix'
            echo
            echo '| Guardrail | Value |'
            echo '|---|---|'
            echo '| PBX | `Issabel LAB` |'
            echo '| Branch | `Audit` |'
            echo '| DB writes | `NONE` |'
            echo '| Live code writes | `NONE` |'
            echo '| Phone writes | `P208 same-current-value only` |'
            echo '| Secret/session values logged | `NO` |'
            echo
            grep -E '^(p208_then_sid_|sid_then_p208_|p208_sid_empty_underscore_|p208_sid_raw_form_|diagnostic|G10-17I-COMPLETE)' "$REPORT" | sed 's/^/`/; s/$/`  /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized report
        uses: actions/upload-artifact@v4
        with:
          name: g10-17i-grandstream-post-payload-matrix-${{ github.run_id }}
          path: ${{ runner.temp }}/g10-17i-grandstream-post-payload-matrix.txt
          retention-days: 30
