name: 51 | Issabel Lab | Dual SIP Peers | Read-Only Audit

on:
  workflow_dispatch:
    inputs:
      source_extension:
        description: 'Extensión origen J129'
        required: true
        default: '200'
        type: string
      destination_extension:
        description: 'Extensión destino SIP'
        required: true
        default: '201'
        type: string
      source_mac:
        description: 'MAC J129 opcional'
        required: false
        default: ''
        type: string
      source_ip:
        description: 'IP esperada J129 opcional'
        required: false
        default: ''
        type: string
      confirm:
        description: 'Escriba AUDIT-LAB-DUAL-SIP'
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Auditar peers SIP 200 y 201 sin originar llamada
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    timeout-minutes: 5

    steps:
      - name: Guard LAB
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'Audit'
          test "$(id -un)" = 'github-runner'
          test '${{ inputs.confirm }}' = 'AUDIT-LAB-DUAL-SIP'
          [[ '${{ inputs.source_extension }}' =~ ^[0-9]{2,8}$ ]]
          [[ '${{ inputs.destination_extension }}' =~ ^[0-9]{2,8}$ ]]
          test '${{ inputs.source_extension }}' != '${{ inputs.destination_extension }}'
          echo 'J129-LAB-DUAL-SIP-GUARD-PASS'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sincronizar helpers restringidos
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(sudo -n /usr/local/sbin/avaya-j129-helper-sync)"
          printf '%s\n' "$OUT"
          grep -F 'HELPER-SYNC-ALL-PASS' <<<"$OUT"

      - name: Auditar ambos peers SIP
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/avaya-j129-lab-call-test \
            preflight \
            '${{ inputs.source_extension }}' \
            '${{ inputs.source_mac }}' \
            '${{ inputs.source_ip }}' \
            '${{ inputs.destination_extension }}' \
            | tee "$RUNNER_TEMP/j129-dual-sip-audit.log"
          grep -F 'SIP-PEER-AUDIT-PASS extension=${{ inputs.source_extension }}' "$RUNNER_TEMP/j129-dual-sip-audit.log"
          grep -F 'SIP-PEER-AUDIT-PASS extension=${{ inputs.destination_extension }}' "$RUNNER_TEMP/j129-dual-sip-audit.log"
          grep -F 'J129-LAB-DUAL-PEER-AUDIT-PASS' "$RUNNER_TEMP/j129-dual-sip-audit.log"

      - name: Guardar evidencia sanitizada
        uses: actions/upload-artifact@v4
        with:
          name: j129-dual-sip-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/j129-dual-sip-audit.log
          retention-days: 90

      - name: Resultado
        shell: bash
        run: |
          echo 'J129-LAB-DUAL-SIP-AUDIT-PASS'
          echo 'NOTE=Solo lectura: no se originó llamada. Listo para prueba física 200 -> 201.'
