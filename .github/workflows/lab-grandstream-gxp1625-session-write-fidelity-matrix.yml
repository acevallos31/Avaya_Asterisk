name: G10-18C | Endpoint Lab | GXP1625 Session & Write Fidelity Matrix | Controlled Test

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN-G10-18C to allow same-value P208 write tests'
        required: true
        type: string

permissions:
  contents: read

jobs:
  g10_18c:
    name: GXP1625 endpoint-lab session/write fidelity matrix
    runs-on: [self-hosted, Linux, X64, endpoint-lab, debian, grandstream-lab]
    env:
      GRANDSTREAM_HTTP_USERNAME: admin
      GRANDSTREAM_HTTP_PASSWORD: ${{ secrets.GRANDSTREAM_GXP1625_HTTP_PASSWORD }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify runner and confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'Audit'
          test "$CONFIRMATION" = 'RUN-G10-18C'
          test -n "${GRANDSTREAM_HTTP_PASSWORD:-}"
          echo "runner_name=${RUNNER_NAME}"
          echo 'credential_value=NOT-PRINTED'

      - name: Run G10-18C session/write fidelity matrix
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/g10-18c-session-write-fidelity-matrix.txt"
          chmod +x endpoint-lab/grandstream/g10-18c-session-write-fidelity-matrix.sh
          endpoint-lab/grandstream/g10-18c-session-write-fidelity-matrix.sh "$REPORT"
          grep -Fq 'G10-18C-COMPLETE' "$REPORT"
          ! grep -Fq "$GRANDSTREAM_HTTP_PASSWORD" "$REPORT"

      - name: Job summary
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/g10-18c-session-write-fidelity-matrix.txt"
          {
            echo '## G10-18C GXP1625 Session & Write Fidelity Matrix'
            echo
            echo '| Guardrail | Value |'
            echo '|---|---|'
            echo '| Runner | `endpoint-lab-debian` |'
            echo '| DB writes | `NONE` |'
            echo '| PBX live-code writes | `NONE` |'
            echo '| Phone writes | `P208 same current value only after successful read` |'
            echo '| Credentials / SID logged | `NO` |'
            echo
            grep -E '^(lan_|tunnel_|G10-18C-COMPLETE)' "$REPORT" | sed 's/^/`/; s/$/`  /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized report
        uses: actions/upload-artifact@v4
        with:
          name: g10-18c-gxp1625-session-write-fidelity-${{ github.run_id }}
          path: ${{ runner.temp }}/g10-18c-session-write-fidelity-matrix.txt
          retention-days: 30
