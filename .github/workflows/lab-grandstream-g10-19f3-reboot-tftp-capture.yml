name: G10-19F3 | Issabel Lab | GXP1625 TFTP RRQ Capture

on:
  push:
    branches: [Audit]
    paths:
      - '.github/workflows/lab-grandstream-g10-19f3-reboot-tftp-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture TFTP RRQ from GXP1625
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Capture RRQ-only traffic for 100 seconds
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/g10-19f3.txt"
          PCAP="$RUNNER_TEMP/g10-19f3.pcap"
          TXT="$RUNNER_TEMP/g10-19f3.txtdump"
          ERR="$RUNNER_TEMP/g10-19f3.err"
          : > "$REPORT"
          log(){ printf '%s\n' "$1" | tee -a "$REPORT"; }
          log 'scope=READ_ONLY_TFTP_RRQ_CAPTURE'
          log 'phone_write=NO'
          log 'db_write=NO'
          log 'pbx_live_code_write=NO'
          log 'cfg_content_logged=NO'
          if ! command -v tcpdump >/dev/null; then
            log 'tcpdump=ABSENT'
            log 'diagnostic=TCPDUMP_NOT_AVAILABLE'
            log 'G10-19F3-COMPLETE=YES'
            exit 0
          fi
          CAP=(tcpdump)
          if sudo -n tcpdump --version >/dev/null 2>&1; then
            CAP=(sudo -n tcpdump)
            log 'capture_privilege=SUDO_AUTHORIZED'
          else
            log 'capture_privilege=UNPRIVILEGED'
          fi
          rm -f "$PCAP" "$ERR"
          set +e
          timeout 100 "${CAP[@]}" -ni any -s 192 -w "$PCAP" 'udp dst port 69' 2>"$ERR"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ] && [ ! -s "$PCAP" ]; then
            log 'tcpdump_capture=FAILED_OR_NO_PERMISSION'
            log 'diagnostic=RRQ_CAPTURE_PRIVILEGE_REQUIRED'
            log 'G10-19F3-COMPLETE=YES'
            exit 0
          fi
          log 'tcpdump_capture=COMPLETED'
          if [ ! -s "$PCAP" ]; then
            log 'rrq_packets=0'
            log 'expected_cfg_rrq=NO'
            log 'diagnostic=NO_TFTP_RRQ_CAPTURED'
            log 'G10-19F3-COMPLETE=YES'
            exit 0
          fi
          tcpdump -nn -A -r "$PCAP" 'udp dst port 69' > "$TXT" 2>/dev/null || true
          COUNT=$(tcpdump -nn -r "$PCAP" 'udp dst port 69' 2>/dev/null | wc -l | tr -d ' ')
          log "rrq_packets=$COUNT"
          if grep -F 'cfgc074ade86609' "$TXT" >/dev/null 2>&1; then
            log 'expected_cfg_rrq=YES'
            log 'diagnostic=GXP1625_CFG_RRQ_PROVEN'
            log 'next_activity=G10-19G_ENDPOINT_CONFIGURATOR_202'
          else
            log 'expected_cfg_rrq=NO'
            log 'diagnostic=TFTP_RRQ_CAPTURED_WITHOUT_EXPECTED_CFG'
            log 'next_activity=G10-19F4_REVIEW_REQUESTED_FILENAME'
          fi
          rm -f "$PCAP" "$TXT" "$ERR"
          log 'G10-19F3-COMPLETE=YES'
      - name: Publish sanitized result summary
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/g10-19f3.txt"
          {
            echo '## G10-19F3 — GXP1625 TFTP RRQ Capture'
            echo
            if [ -f "$REPORT" ]; then
              grep -E '^(scope=|phone_write=|capture_privilege=|tcpdump=|tcpdump_capture=|rrq_packets=|expected_cfg_rrq=|diagnostic=|next_activity=|G10-19F3-COMPLETE=)' "$REPORT" || true
            else
              echo 'report=NOT_CREATED'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g10-19f3-${{ github.run_id }}
          path: ${{ runner.temp }}/g10-19f3.txt
          if-no-files-found: warn
          retention-days: 30
