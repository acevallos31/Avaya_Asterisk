name: Issabel Lab J129 HTTP Root

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acción controlada"
        required: true
        default: install
        type: choice
        options:
          - install
          - rollback

permissions:
  contents: read

jobs:
  http-root:
    name: Publicar provisioning J129 en raiz HTTP del LAB
    runs-on: [self-hosted, Linux, X64, issabel-lab]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verificar identidad del runner
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(id -un)@$(hostname)"
          test "$(id -un)" = "github-runner"

      - name: Sincronizar helper restringido
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/sbin/avaya-j129-helper-sync
          sudo -n -l | grep -F '/usr/local/sbin/avaya-j129-helper-sync'
          sudo /usr/local/sbin/avaya-j129-helper-sync
          sudo -n -l | grep -F '/usr/local/sbin/avaya-j129-lab-deploy'

      - name: Aplicar configuración HTTP
        if: ${{ inputs.action == 'install' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/avaya-j129-lab-deploy install-http "$GITHUB_WORKSPACE/deploy/j129"

      - name: Verificar URLs de provisioning
        if: ${{ inputs.action == 'install' }}
        shell: bash
        run: |
          set -euo pipefail
          PBX_IP='192.168.1.169'
          for path in /46xxsettings.txt /c81fea9b650d.txt; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "http://${PBX_IP}${path}")"
            echo "HTTP ${path} -> ${code}"
            test "$code" = "200"
          done
          echo 'J129-HTTP-ROOT-VERIFY-PASS'

      - name: Rollback configuración HTTP
        if: ${{ inputs.action == 'rollback' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/avaya-j129-lab-deploy rollback-http "$GITHUB_WORKSPACE/deploy/j129"

      - name: Resultado
        shell: bash
        run: |
          set -euo pipefail
          echo 'J129-HTTP-ROOT-WORKFLOW-PASS'
