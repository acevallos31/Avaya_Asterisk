name: G10-19E4E | Endpoint Lab | GXP1625 Chromium Native Bootstrap

on:
  push:
    branches: [Audit]
    paths:
      - 'endpoint-lab/grandstream/g10-19e4e-chromium-native-bootstrap.js'
      - '.github/workflows/lab-grandstream-g10-19e4e-chromium-native-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Apply P212/P237 inside authenticated Chromium session
    runs-on: [self-hosted, Linux, X64, endpoint-lab, debian, grandstream-lab]
    timeout-minutes: 5
    env:
      PHONE_PASSWORD: ${{ secrets.GRANDSTREAM_GXP1625_HTTP_PASSWORD }}
      PHONE_USERNAME: admin
      PHONE_BASE: http://192.168.1.167
      PBX_IP: 192.168.1.10
    steps:
      - uses: actions/checkout@v4
      - name: Controlled Chromium bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'Audit'
          command -v chromium >/dev/null
          test -n "$PHONE_PASSWORD"
          export REPORT_PATH="$RUNNER_TEMP/g10-19e4e.txt"
          node endpoint-lab/grandstream/g10-19e4e-chromium-native-bootstrap.js
          grep -Fq 'G10-19E4E-COMPLETE=YES' "$REPORT_PATH"
      - name: Publish sanitized summary
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/g10-19e4e.txt"
          {
            echo '## G10-19E4E — Chromium native provisioning bootstrap'
            echo
            if [ -f "$REPORT" ]; then
              grep -E '^(scope=|phone_write=|factory_reset=|login_ui_action=|login_sid_captured_in_memory=|session_identity_present=|session_role_present=|write_attempted=|write_http=|write_response=|write_status=|verify_http=|verify_response=|p212_target_match=|p237_target_match=|diagnostic=|next_activity=|G10-19E4E-COMPLETE=)' "$REPORT" || true
            else
              echo 'report=NOT_CREATED'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g10-19e4e-${{ github.run_id }}
          path: ${{ runner.temp }}/g10-19e4e.txt
          if-no-files-found: warn
          retention-days: 30
