name: G10-17F | Issabel Lab | GXP1625 Browser Header Write Matrix | Controlled Test

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Escribe RUN-G10-17F para ejecutar writes idempotentes P208=valor actual'
        required: true
        type: string

permissions:
  contents: read

jobs:
  g10_17f:
    name: Grandstream GXP1625 browser-header controlled write matrix
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    timeout-minutes: 10
    env:
      GRANDSTREAM_HTTP_USERNAME: admin
      GRANDSTREAM_HTTP_PASSWORD: ${{ secrets.GRANDSTREAM_GXP1625_HTTP_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Audit branch, runner and confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'Audit'
          test "$(id -un)" = 'github-runner'
          test "$CONFIRMATION" = 'RUN-G10-17F'
          test -n "${GRANDSTREAM_HTTP_PASSWORD:-}"
          echo 'credential_source=GITHUB-ACTIONS-SECRET'
          echo 'credential_value=NOT-PRINTED'

      - name: Validate diagnostic script
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/grandstream-gxp1625-browser-header-write-matrix.py
          grep -Fq 'Sec-Fetch-Site' scripts/grandstream-gxp1625-browser-header-write-matrix.py
          grep -Fq 'phone_write=SAME-VALUE-P208-ONLY' scripts/grandstream-gxp1625-browser-header-write-matrix.py

      - name: Run G10-17F controlled matrix
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/g10-17f-grandstream-browser-header-write-matrix.txt"
          python3 scripts/grandstream-gxp1625-browser-header-write-matrix.py "$REPORT"
          grep -Fq 'G10-17F-COMPLETE' "$REPORT"
          ! grep -Fq "$GRANDSTREAM_HTTP_PASSWORD" "$REPORT"

      - name: Job summary
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/g10-17f-grandstream-browser-header-write-matrix.txt"
          {
            echo '## G10-17F Grandstream GXP1625 browser header write matrix'
            echo
            echo '| Guardrail | Value |'
            echo '|---|---|'
            echo '| PBX | `Issabel LAB` |'
            echo '| Branch | `Audit` |'
            echo '| DB writes | `NONE` |'
            echo '| Live code writes | `NONE` |'
            echo '| Phone writes | `P208 same-current-value only` |'
            echo '| Secret/session values logged | `NO` |'
            echo
            if [ -f "$REPORT" ]; then
              grep -E '^(no_cookie_|with_cookie_|browser_|diagnostic|G10-17F-COMPLETE)' "$REPORT" | sed 's/^/`/; s/$/`  /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g10-17f-grandstream-browser-header-write-matrix-${{ github.run_id }}
          path: ${{ runner.temp }}/g10-17f-grandstream-browser-header-write-matrix.txt
          if-no-files-found: warn
          retention-days: 30
