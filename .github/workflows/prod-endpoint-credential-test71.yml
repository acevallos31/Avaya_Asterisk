name: 71 | Ceiba Production | Endpoint Credentials | Controlled Runtime Install

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escriba INSTALL-ENDPOINT-CREDENTIALS-PROD'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: endpoint-credential-runtime-ceiba-production
  cancel-in-progress: false

env:
  TEST71_CANDIDATE_SHA: ef176c99935af5f833248358c4daf7b4ca0dde6a
  TEST71_HELPER_BLOB: 3c16593a0f2490e00ad912838ec32eed2b35e26a
  TEST71_ROOT: /opt/actions-runner-prod/_work/Avaya_Asterisk/Avaya_Asterisk/_test71_candidate
  TEST70_APPROVED_RUN: '35123613203'

jobs:
  static-audit:
    name: Static candidate audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable Test71 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TEST71_CANDIDATE_SHA }}

      - name: Validate helper and credential foundation
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/endpoint-configurator/bin/endpoint-credential-prod-deploy
          bash -n deploy/endpoint-configurator/bin/install-key.sh
          python3 -m unittest tests.audit.test_endpoint_credential_foundation tests.audit.test_endpoint_main_account_status -v
          python3 - deploy/endpoint-configurator/bin/endpoint-credential-prod-deploy "$TEST71_HELPER_BLOB" <<'PY'
          import hashlib
          import pathlib
          import sys
          p = pathlib.Path(sys.argv[1])
          data = p.read_bytes()
          actual = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          if actual != sys.argv[2]:
              raise SystemExit("TEST71-HELPER-INTEGRITY-FAIL expected=%s actual=%s" % (sys.argv[2], actual))
          print("TEST71-HELPER-INTEGRITY-PASS=%s" % actual)
          PY

  production-install:
    name: Ceiba controlled runtime install
    needs: static-audit
    runs-on: [self-hosted, Linux, X64, j129-production, cei-pbx02]
    timeout-minutes: 20
    steps:
      - name: Guard estricto de producción
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'main'
          test '${{ inputs.confirm }}' = 'INSTALL-ENDPOINT-CREDENTIALS-PROD'
          test "$(id -un)" = 'github-runner-prod'
          test "$(hostname -s)" = 'cei-pbx02'
          echo "TEST70_APPROVED_RUN=$TEST70_APPROVED_RUN"
          echo 'TEST71-PROD-RUNNER-GUARD-PASS'

      - name: Checkout immutable Test71 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TEST71_CANDIDATE_SHA }}
          path: _test71_candidate
          clean: true
          persist-credentials: false

      - name: Verify candidate and root-owned helper
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_WORKSPACE/_test71_candidate"
          helper_src="$candidate/deploy/endpoint-configurator/bin/endpoint-credential-prod-deploy"
          helper_dst='/usr/local/sbin/issabel-endpoint-credential-prod'
          test "$candidate" = "$TEST71_ROOT"
          test -f "$helper_src"
          python3 - "$helper_src" "$TEST71_HELPER_BLOB" <<'PY'
          import hashlib
          import pathlib
          import sys
          p = pathlib.Path(sys.argv[1])
          data = p.read_bytes()
          actual = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          if actual != sys.argv[2]:
              raise SystemExit("TEST71-HELPER-INTEGRITY-FAIL expected=%s actual=%s" % (sys.argv[2], actual))
          print("TEST71-HELPER-INTEGRITY-PASS=%s" % actual)
          PY
          test -x "$helper_dst"
          test "$(stat -c '%U:%G:%a' "$helper_dst")" = 'root:root:755'
          sudo -n -l | grep -F "$helper_dst" >/dev/null
          echo 'TEST71-ROOT-HELPER-GUARD-PASS'

      - name: Production preflight immediately before install
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/test71-endpoint-credential-prod.txt"
          : > "$report"
          chmod 0600 "$report"
          sudo -n /usr/local/sbin/issabel-endpoint-credential-prod preflight "$TEST71_ROOT" | tee -a "$report"

      - name: Controlled runtime install
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/test71-endpoint-credential-prod.txt"
          sudo -n /usr/local/sbin/issabel-endpoint-credential-prod install "$TEST71_ROOT" INSTALL-ENDPOINT-CREDENTIALS-PROD | tee -a "$report"

      - name: Verify installed runtime
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/test71-endpoint-credential-prod.txt"
          sudo -n /usr/local/sbin/issabel-endpoint-credential-prod verify "$TEST71_ROOT" | tee -a "$report"
          sudo -n /usr/local/sbin/avaya-j129-prod-validation fleet-audit | tee -a "$report"
          grep -F 'TEST71-LIMITED-DDL-GRANTS-PASS' "$report" >/dev/null
          grep -F 'TEST71-PROD-ENDPOINT-CREDENTIAL-RUNTIME=PASS' "$report" >/dev/null
          grep -F 'J129-PROD-FLEET-AUDIT-PASS' "$report" >/dev/null
          echo 'phone_write=NO' | tee -a "$report"
          echo 'TEST71-PROD-CONTROLLED-INSTALL=PASS' | tee -a "$report"

      - name: Guardar evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test71-endpoint-credential-prod-${{ github.run_id }}
          path: ${{ runner.temp }}/test71-endpoint-credential-prod.txt
          if-no-files-found: ignore
          retention-days: 90
