name: 70 | Ceiba Production | Endpoint Credentials | Read-Only Preflight

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escriba PREFLIGHT-ENDPOINT-CREDENTIALS-PROD'
        required: true
        type: string

permissions:
  contents: read

env:
  TEST70_CANDIDATE_SHA: 83f1d5b3522015fb3006fbc436f85691feb49591
  TEST70_SCRIPT_BLOB: cb61d86836176e1608a7fa4cdc53b5b7baa8a798
  TEST70_BASELINE_SHA: ce90056c652c7e3a280fc8a1416580e6172dcc01

jobs:
  production-preflight:
    name: Ceiba read-only preflight
    runs-on: [self-hosted, Linux, X64, j129-production, cei-pbx02]
    timeout-minutes: 15
    steps:
      - name: Guard estricto
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'main'
          test '${{ inputs.confirm }}' = 'PREFLIGHT-ENDPOINT-CREDENTIALS-PROD'
          test "$(id -un)" = 'github-runner-prod'
          test "$(hostname -s)" = 'cei-pbx02'
          echo 'TEST70-PROD-RUNNER-GUARD-PASS'

      - name: Checkout pinned Test70 harness
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST70_CANDIDATE_SHA }}
          path: _candidate_test70
          clean: true

      - name: Checkout immutable Audit baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST70_BASELINE_SHA }}
          path: _baseline_test70
          clean: true

      - name: Verify pinned harness
        shell: bash
        run: |
          set -euo pipefail
          script="$GITHUB_WORKSPACE/_candidate_test70/scripts/prod-endpoint-credential-preflight.sh"
          test -f "$script"
          test -f "$GITHUB_WORKSPACE/_baseline_test70/var/www/html/modules/endpoint_configurator/index.php"
          python3 - "$script" "$TEST70_SCRIPT_BLOB" <<'PY'
          import hashlib
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          expected = sys.argv[2]
          data = path.read_bytes()
          actual = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          if actual != expected:
              raise SystemExit("TEST70-HARNESS-INTEGRITY-FAIL expected=%s actual=%s" % (expected, actual))
          print("TEST70-HARNESS-BLOB-PASS=%s" % actual)
          PY
          bash -n "$script"
          echo 'TEST70-HARNESS-INTEGRITY-PASS'

      - name: Execute read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          script="$GITHUB_WORKSPACE/_candidate_test70/scripts/prod-endpoint-credential-preflight.sh"
          REPORT="$RUNNER_TEMP/test70-endpoint-credential-preflight.txt" \
          BASELINE_ROOT="$GITHUB_WORKSPACE/_baseline_test70/var/www/html/modules/endpoint_configurator" \
          bash "$script"

      - name: Guardar evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test70-endpoint-credential-prod-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/test70-endpoint-credential-preflight.txt
          if-no-files-found: ignore
          retention-days: 90
