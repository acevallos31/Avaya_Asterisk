name: 70 | Ceiba Production | Endpoint Credentials | Read-Only Preflight

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escriba PREFLIGHT-ENDPOINT-CREDENTIALS-PROD'
        required: true
        type: string

permissions:
  contents: read

env:
  TEST70_CANDIDATE_SHA: 207c58e315e36184091ed5cd37080842434215ab
  TEST70_SCRIPT_BLOB: 7545b2e14981da8ca07446ef2ec8d6200ddf4f9b

jobs:
  production-preflight:
    name: Ceiba read-only preflight
    runs-on: [self-hosted, Linux, X64, j129-production, cei-pbx02]
    timeout-minutes: 15
    steps:
      - name: Guard estricto
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'main'
          test '${{ inputs.confirm }}' = 'PREFLIGHT-ENDPOINT-CREDENTIALS-PROD'
          test "$(id -un)" = 'github-runner-prod'
          test "$(hostname -s)" = 'cei-pbx02'
          echo 'TEST70-PROD-RUNNER-GUARD-PASS'

      - name: Checkout pinned Test70 harness
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST70_CANDIDATE_SHA }}
          path: _candidate_test70
          clean: true

      - name: Verify pinned harness
        shell: bash
        run: |
          set -euo pipefail
          script="$GITHUB_WORKSPACE/_candidate_test70/scripts/prod-endpoint-credential-preflight.sh"
          test "$(git -C "$GITHUB_WORKSPACE/_candidate_test70" rev-parse HEAD)" = "$TEST70_CANDIDATE_SHA"
          test "$(git hash-object "$script")" = "$TEST70_SCRIPT_BLOB"
          bash -n "$script"
          echo 'TEST70-HARNESS-INTEGRITY-PASS'

      - name: Execute read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          script="$GITHUB_WORKSPACE/_candidate_test70/scripts/prod-endpoint-credential-preflight.sh"
          REPORT="$RUNNER_TEMP/test70-endpoint-credential-preflight.txt" bash "$script"

      - name: Guardar evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test70-endpoint-credential-prod-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/test70-endpoint-credential-preflight.txt
          if-no-files-found: ignore
          retention-days: 90
