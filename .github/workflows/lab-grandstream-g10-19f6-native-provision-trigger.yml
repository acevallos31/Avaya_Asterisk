name: G10-19F6 | Endpoint Lab | GXP1625 Native Provision Trigger

on:
  push:
    branches: [Audit]
    paths:
      - 'endpoint-lab/grandstream/g10-19f6-chromium-provision-trigger.js'
      - '.github/workflows/lab-grandstream-g10-19f6-native-provision-trigger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-provision-trigger:
    name: Point to Issabel TFTP then trigger native PROV
    runs-on: [self-hosted, Linux, X64, endpoint-lab, debian, grandstream-lab]
    timeout-minutes: 10
    env:
      PHONE_PASSWORD: ${{ secrets.GRANDSTREAM_GXP1625_HTTP_PASSWORD }}
      PHONE_USERNAME: admin
      PHONE_BASE: http://192.168.1.167
      PHONE_IP: 192.168.1.167
      PBX_IP: 192.168.1.10
    steps:
      - uses: actions/checkout@v4
      - name: Set live provisioning target to Issabel TFTP
        shell: bash
        run: |
          set -euo pipefail
          export REPORT_PATH="$RUNNER_TEMP/g10-19f6-bootstrap.txt"
          node endpoint-lab/grandstream/g10-19e4f4-ui-persist-bootstrap.js
          grep -Fq 'p212_target_match=YES' "$REPORT_PATH"
          grep -Fq 'p237_target_match=YES' "$REPORT_PATH"
      - name: Trigger native provisioning operation
        shell: bash
        run: |
          set -euo pipefail
          export REPORT_PATH="$RUNNER_TEMP/g10-19f6-prov.txt"
          node endpoint-lab/grandstream/g10-19f6-chromium-provision-trigger.js
          grep -Fq 'G10-19F6-COMPLETE=YES' "$REPORT_PATH"
      - name: Wait for phone to settle
        id: wait
        shell: bash
        run: |
          set +e
          sleep 15
          READY=NO
          for i in $(seq 1 48); do
            if curl -fsS --connect-timeout 2 --max-time 3 "$PHONE_BASE/" >/dev/null 2>&1; then READY=YES; break; fi
            sleep 5
          done
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          echo "phone_http_returned=$READY" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Read Account 1 after native provisioning
        if: steps.wait.outputs.ready == 'YES'
        shell: bash
        run: |
          set -euo pipefail
          export REPORT_PATH="$RUNNER_TEMP/g10-19f6-account.txt"
          node endpoint-lab/grandstream/g10-19g2-chromium-account-state.js
          grep -Fq 'G10-19G2-COMPLETE=YES' "$REPORT_PATH"
          {
            echo '## G10-19F6 — Account 1 after PROV'
            grep -E '^(account_enabled=|account_name_target_202=|sip_server_target_pbx=|sip_user_id=|auth_id=|diagnostic=)' "$REPORT_PATH" || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Read provisioning state after native provisioning
        if: steps.wait.outputs.ready == 'YES'
        shell: bash
        run: |
          set -euo pipefail
          export REPORT_PATH="$RUNNER_TEMP/g10-19f6-provisioning.txt"
          python3 endpoint-lab/grandstream/g10-19e-provisioning-state-preflight.py
          {
            echo
            echo '## G10-19F6 — Provisioning state after PROV'
            grep -E '^(p212_value=|p237_target=|diagnostic=|next_activity=)' "$REPORT_PATH" || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish PROV result
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/g10-19f6-prov.txt"
          {
            echo
            echo '## G10-19F6 — Native PROV trigger'
            [ -f "$REPORT" ] && grep -E '^(scope=|phone_write=|factory_reset=|session_identity_present=|session_prov_http=|session_prov_response=|provision_auth_method=|provision_http=|provision_response=|provision_body_class=|provision_request=|diagnostic=|next_activity=|G10-19F6-COMPLETE=)' "$REPORT" || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g10-19f6-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/g10-19f6-bootstrap.txt
            ${{ runner.temp }}/g10-19f6-prov.txt
            ${{ runner.temp }}/g10-19f6-account.txt
            ${{ runner.temp }}/g10-19f6-provisioning.txt
          if-no-files-found: warn
          retention-days: 30
