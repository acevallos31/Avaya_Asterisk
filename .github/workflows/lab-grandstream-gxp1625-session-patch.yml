name: G10-16 | Issabel Lab | GXP1625 Session Propagation Patch | Controlled Apply

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción controlada'
        required: true
        type: choice
        options:
          - inspect
          - apply
          - rollback
        default: inspect
      confirmation:
        description: 'apply: APPLY-G10-16 | rollback: ROLLBACK-G10-16 | inspect: dejar vacío'
        required: false
        type: string

permissions:
  contents: read

jobs:
  grandstream-session-patch:
    name: Grandstream GXP1625 controlled session propagation patch
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Audit branch and runner
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'Audit'
          test "$(id -un)" = 'github-runner'

      - name: Prepare and validate authorized helper source
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/grandstream/prepare-g10-15-helper.py deploy/j129/avaya-j129-lab-deploy
          python3 deploy/grandstream/prepare-g10-16-helper.py deploy/j129/avaya-j129-lab-deploy
          bash -n deploy/j129/avaya-j129-lab-deploy
          grep -Fq 'apply-session-patch' deploy/j129/avaya-j129-lab-deploy
          grep -Fq "cookie_parts = []" deploy/j129/avaya-j129-lab-deploy
          grep -Fq "headers['Cookie'] = '; '.join(cookie_parts)" deploy/j129/avaya-j129-lab-deploy

      - name: Sync authorized lab helper
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(sudo -n /usr/local/sbin/avaya-j129-helper-sync)"
          printf '%s\n' "$OUT"
          grep -Fq 'HELPER-SYNC-PASS name=avaya-j129-lab-deploy' <<<"$OUT"
          sudo -n -l 2>&1 | grep -F '/usr/local/sbin/avaya-j129-lab-deploy' >/dev/null

      - name: Run controlled action
        id: controlled
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/g10-16-grandstream-session-patch.txt"
          {
            echo '=== G10-16 GRANDSTREAM GXP1625 SESSION PROPAGATION PATCH ==='
            echo "requested_action=$ACTION"
            echo 'target=/usr/share/issabel/endpoint-classes/class/issabel/vendor/Grandstream.py'
            echo 'db_write=NO'
            echo 'phone_configuration_write=NO'
            echo 'requires_g10_14=YES'
            echo 'requires_g10_15=YES'
            echo 'secrets_logged=NO'
            echo
            case "$ACTION" in
              inspect)
                sudo -n /usr/local/sbin/avaya-j129-lab-deploy inspect-session-patch
                ;;
              apply)
                test "$CONFIRMATION" = 'APPLY-G10-16' || {
                  echo 'ERROR: confirmación requerida: APPLY-G10-16' >&2
                  exit 2
                }
                sudo -n /usr/local/sbin/avaya-j129-lab-deploy apply-session-patch
                sudo -n /usr/local/sbin/avaya-j129-lab-deploy inspect-session-patch
                ;;
              rollback)
                test "$CONFIRMATION" = 'ROLLBACK-G10-16' || {
                  echo 'ERROR: confirmación requerida: ROLLBACK-G10-16' >&2
                  exit 2
                }
                sudo -n /usr/local/sbin/avaya-j129-lab-deploy rollback-session-patch
                sudo -n /usr/local/sbin/avaya-j129-lab-deploy inspect-session-patch
                ;;
              *)
                echo "ERROR: acción no soportada: $ACTION" >&2
                exit 2
                ;;
            esac
            echo
            echo 'G10-16-PASS'
          } | tee "$REPORT"
          grep -Fq 'G10-16-PASS' "$REPORT"
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/g10-16-grandstream-session-patch.txt"
          {
            echo '## G10-16 Grandstream GXP1625 session propagation patch'
            echo
            echo '| Guardrail | Value |'
            echo '|---|---|'
            echo '| PBX | `Issabel LAB` |'
            echo '| Branch | `Audit` |'
            echo '| DB writes | `NONE` |'
            echo '| Phone writes | `NONE` |'
            echo '| Live code target | `Grandstream.py` |'
            echo '| Depends on | `G10-14 + G10-15` |'
            echo '| Session data logged | `NO` |'
            echo '| Privileged path | `avaya-j129-lab-deploy` |'
            echo
            if [ -f "$REPORT" ]; then
              grep -E '^(requested_action|grandstream_py_sha256|username_payload_line_count|host_header_line_count|referer_header_line_count|cookie_collect_line_count|cookie_header_line_count|g10_16_backup_present|session_patch_state|before_sha256|after_sha256|restored_sha256|GRANDSTREAM-SESSION-PATCH-|G10-16-PASS)' "$REPORT" | sed 's/^/`/; s/$/`  /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g10-16-grandstream-session-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/g10-16-grandstream-session-patch.txt
          if-no-files-found: warn
          retention-days: 30
