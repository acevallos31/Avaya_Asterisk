name: Issabel Lab Read-Only Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab-readonly:
    name: Inventario de PBX LAB
    runs-on: [self-hosted, Linux, X64, issabel-lab]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Identidad del runner
        run: |
          set -euo pipefail
          whoami
          hostname
          pwd

      - name: Sistema operativo
        run: |
          set -euo pipefail
          cat /etc/os-release

      - name: Versiones de Issabel y Asterisk
        run: |
          set -euo pipefail
          asterisk -V
          python3 --version
          rpm -qa | grep -i '^issabel-endpointconfig' || true

      - name: Red de la PBX
        run: |
          set -euo pipefail
          ip addr
          ip route

      - name: Paquete Endpoint Configurator
        run: |
          set -euo pipefail
          echo '=== RPM instalado ==='
          rpm -q issabel-endpointconfig2
          echo '=== Archivos relevantes del paquete ==='
          rpm -ql issabel-endpointconfig2 | grep -E 'issabel-endpointconfig$|BaseEndpoint\.py$|Extension\.py$|/vendor/|/templates?/|/endpoint_configurator/' | sort || true
          echo '=== Verificacion RPM (solo metadatos de diferencias) ==='
          rpm -V issabel-endpointconfig2 || true

      - name: Hashes de archivos core legibles
        run: |
          set -euo pipefail
          echo '=== Hash del ejecutable principal ==='
          sha256sum /usr/bin/issabel-endpointconfig
          echo '=== BaseEndpoint y Extension instalados ==='
          for f in $(rpm -ql issabel-endpointconfig2 | grep -E '/(BaseEndpoint|Extension)\.py$' || true); do
            if [ -r "$f" ]; then
              sha256sum "$f"
            else
              echo "NO-LEGIBLE $f"
            fi
          done

      - name: Inventario de vendors y plantillas
        run: |
          set -euo pipefail
          echo '=== Vendors Python instalados ==='
          rpm -ql issabel-endpointconfig2 | grep -E '/vendor/[^/]+\.py$' | sort || true
          echo '=== Referencias Avaya dentro del paquete stock ==='
          rpm -ql issabel-endpointconfig2 | grep -i avaya || true
          echo '=== Plantillas/configuraciones relacionadas con telefonos ==='
          rpm -ql issabel-endpointconfig2 | grep -Ei '(template|tpl|phone|vendor)' | head -n 250 || true

      - name: Estado de directorio TFTP sin mostrar secretos
        run: |
          set -euo pipefail
          echo '=== /tftpboot ==='
          if [ -d /tftpboot ]; then
            find /tftpboot -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort | head -n 250 || true
            echo '=== Conteo de archivos ==='
            find /tftpboot -maxdepth 1 -type f 2>/dev/null | wc -l
          else
            echo 'NO-EXISTE /tftpboot'
          fi

      - name: Servicios y puertos de provisionamiento
        run: |
          set -euo pipefail
          echo '=== Servicios potencialmente relacionados ==='
          systemctl list-units --type=service --all --no-pager | grep -Ei 'httpd|apache|nginx|tftp|dhcp|asterisk' || true
          echo '=== Puertos en escucha relevantes ==='
          ss -lntup 2>/dev/null | grep -E ':(69|80|443|5060|5061)([^0-9]|$)' || true

      - name: Verificar archivos de Endpoint Configurator en solo lectura
        run: |
          set -euo pipefail
          test -r /usr/bin/issabel-endpointconfig
          ls -l /usr/bin/issabel-endpointconfig
          echo 'READ-ONLY-PASS /usr/bin/issabel-endpointconfig'

      - name: Comprobar que el runner no tiene privilegios administrativos
        run: |
          set -euo pipefail
          echo "Usuario efectivo: $(id -un)"
          id
          if sudo -n true 2>/dev/null; then
            echo 'ADVERTENCIA: el runner tiene sudo sin contraseña'
            exit 1
          else
            echo 'SECURITY-PASS: runner sin sudo no interactivo'
          fi

      - name: Confirmar conectividad HTTPS con GitHub
        run: |
          set -euo pipefail
          curl -fsSI --connect-timeout 10 https://github.com | head -n 1
