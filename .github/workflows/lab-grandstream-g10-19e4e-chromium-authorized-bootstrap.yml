name: G10-19E4E | Endpoint Lab | GXP1625 Chromium Authorized Bootstrap

on:
  push:
    branches: [Audit]
    paths:
      - 'endpoint-lab/grandstream/g10-19e4e-chromium-authorized-bootstrap.js'
      - '.github/workflows/lab-grandstream-g10-19e4e-chromium-authorized-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Apply P212/P237 using real Chromium session
    runs-on: [self-hosted, Linux, X64, endpoint-lab, debian, grandstream-lab]
    timeout-minutes: 5
    env:
      PHONE_PASSWORD: ${{ secrets.GRANDSTREAM_GXP1625_HTTP_PASSWORD }}
      PHONE_USERNAME: admin
      PHONE_BASE: http://192.168.1.167
      PBX_IP: 192.168.1.10
    steps:
      - uses: actions/checkout@v4
      - name: Controlled Chromium bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'Audit'
          command -v chromium >/dev/null
          test -n "$PHONE_PASSWORD"
          export REPORT_PATH="$RUNNER_TEMP/g10-19e4e.txt"
          node endpoint-lab/grandstream/g10-19e4e-chromium-authorized-bootstrap.js
          grep -Fq 'G10-19E4E-COMPLETE=YES' "$REPORT_PATH"
          grep -E '^(scope=|login_ui_action=|cookie_names_after_login=|session_identity_present=|session_role_present=|pre_read=|phone_write_result=|bootstrap_post_|verify_read=|p212_target_match=|p237_target_match=|diagnostic=|next_activity=|G10-19E4E-COMPLETE=)' "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g10-19e4e-${{ github.run_id }}
          path: ${{ runner.temp }}/g10-19e4e.txt
          if-no-files-found: warn
          retention-days: 30
