name: G10-19F4B | Endpoint Lab | GXP1625 Post-Reboot Read

on:
  push:
    branches: [Audit]
    paths:
      - '.github/workflows/lab-grandstream-g10-19f4b-post-reboot-read.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-reboot-read:
    name: Wait longer and read phone state without writes
    runs-on: [self-hosted, Linux, X64, endpoint-lab, debian, grandstream-lab]
    timeout-minutes: 8
    env:
      PHONE_PASSWORD: ${{ secrets.GRANDSTREAM_GXP1625_HTTP_PASSWORD }}
      PHONE_USERNAME: admin
      PHONE_BASE: http://192.168.1.167
      PHONE_IP: 192.168.1.167
      PBX_IP: 192.168.1.10
    steps:
      - uses: actions/checkout@v4
      - name: Wait up to five minutes for HTTP
        id: wait
        shell: bash
        run: |
          set +e
          READY=NO
          for i in $(seq 1 60); do
            if curl -fsS --connect-timeout 2 --max-time 3 "$PHONE_BASE/" >/dev/null 2>&1; then
              READY=YES
              break
            fi
            sleep 5
          done
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          echo "phone_http_returned=$READY" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Read P212/P237 after long boot
        if: steps.wait.outputs.ready == 'YES'
        shell: bash
        run: |
          set -euo pipefail
          export REPORT_PATH="$RUNNER_TEMP/g10-19f4b-provisioning.txt"
          python3 endpoint-lab/grandstream/g10-19e-provisioning-state-preflight.py
          grep -Fq 'G10-19E-COMPLETE' "$REPORT_PATH"
          {
            echo '## G10-19F4B — Provisioning state'
            grep -E '^(login=|read=|p212_value=|p237_target=|diagnostic=|next_activity=)' "$REPORT_PATH" || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Read Account 1 after long boot
        if: steps.wait.outputs.ready == 'YES'
        shell: bash
        run: |
          set -euo pipefail
          export REPORT_PATH="$RUNNER_TEMP/g10-19f4b-account.txt"
          node endpoint-lab/grandstream/g10-19g2-chromium-account-state.js
          grep -Fq 'G10-19G2-COMPLETE=YES' "$REPORT_PATH"
          {
            echo
            echo '## G10-19F4B — Account 1 state'
            grep -E '^(account_enabled=|account_name_target_202=|sip_server_target_pbx=|sip_user_id=|auth_id=|diagnostic=)' "$REPORT_PATH" || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Classify unavailable phone
        if: steps.wait.outputs.ready != 'YES'
        shell: bash
        run: |
          echo 'diagnostic=PHONE_HTTP_NOT_RETURNED_WITHIN_5_MIN' >> "$GITHUB_STEP_SUMMARY"
          echo 'next_activity=STOP_PHYSICAL_PHONE_RECOVERY_CHECK' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g10-19f4b-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/g10-19f4b-provisioning.txt
            ${{ runner.temp }}/g10-19f4b-account.txt
          if-no-files-found: warn
          retention-days: 30
