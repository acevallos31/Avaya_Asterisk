name: G10-09 | Issabel Lab | GXP1625 Real HTTP Auth | Controlled Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g10_09:
    name: Grandstream GXP1625 real HTTP auth
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    env:
      GRANDSTREAM_HTTP_USERNAME: admin
      GRANDSTREAM_HTTP_PASSWORD: ${{ secrets.GRANDSTREAM_GXP1625_HTTP_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Audit branch and runner
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'Audit'
          test "$(id -un)" = 'github-runner'

      - name: Verify protected credential exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GRANDSTREAM_HTTP_PASSWORD:-}"
          echo 'protected_credential=AVAILABLE'
          echo 'credential_value=NOT-PRINTED'

      - name: Run controlled real HTTP auth test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/grandstream-gxp1625-http-auth-real.sh
          scripts/grandstream-gxp1625-http-auth-real.sh "$RUNNER_TEMP/g10-09-grandstream-http-auth-real.txt"
          grep -Fq 'G10-09-PASS' "$RUNNER_TEMP/g10-09-grandstream-http-auth-real.txt"

      - name: Job summary
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/g10-09-grandstream-http-auth-real.txt"
          {
            echo '## G10-09 Grandstream GXP1625 real HTTP auth'
            echo
            echo '| Field | Value |'
            echo '|---|---|'
            echo '| Phone | `192.168.1.167` |'
            echo '| Firmware Prog | `1.0.7.70` |'
            echo '| Credential source | `GitHub Actions secret` |'
            echo '| Credential printed | `NO` |'
            echo '| Configuration writes | `NONE` |'
            echo '| api.values.post | `NOT CALLED` |'
            echo
            if [ -f "$REPORT" ]; then
              grep -E '^(auth_probe|credentials_logged|credential_source|G10-09-PASS)' "$REPORT" | sed 's/^/`/; s/$/`  /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g10-09-grandstream-http-auth-${{ github.run_id }}
          path: ${{ runner.temp }}/g10-09-grandstream-http-auth-real.txt
          if-no-files-found: error
          retention-days: 30
