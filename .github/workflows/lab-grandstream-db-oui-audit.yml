name: G-TMP-02 | Issabel Lab | Grandstream DB & OUI | Read-Only Audit

on:
  workflow_dispatch:
    inputs:
      mac_prefix:
        description: 'OUI/prefijo MAC a buscar'
        required: true
        default: 'C0:74:AD'
        type: string
      model:
        description: 'Modelo Grandstream a verificar'
        required: true
        default: 'GXP1625'
        type: string

permissions:
  contents: read

jobs:
  grandstream-db-oui-audit:
    name: Auditoría Grandstream DB/OUI en LAB
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inicializar reporte
        shell: bash
        env:
          PREFIX: ${{ inputs.mac_prefix }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/grandstream-db-oui-audit.txt"
          : > "$REPORT"
          {
            echo '=== GRANDSTREAM DB & OUI AUDIT (SOLO LECTURA) ==='
            echo "prefix=$PREFIX"
            echo "model=$MODEL"
            echo "runner=$(id -un)@$(hostname -s)"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$REPORT"

      - name: Verificar runner y helper autorizado
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/grandstream-db-oui-audit.txt"
          test "$(id -un)" = 'github-runner'
          {
            echo '=== AUTHORIZED DB HELPER ==='
            test -x /usr/local/sbin/avaya-j129-lab-deploy && echo 'helper=present' || echo 'helper=missing'
            sudo -n -l 2>/dev/null | grep -F '/usr/local/sbin/avaya-j129-lab-deploy' >/dev/null \
              && echo 'helper_sudo=authorized' || echo 'helper_sudo=not-authorized'
          } | tee -a "$REPORT"

      - name: Baseline DB mediante helper existente
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/grandstream-db-oui-audit.txt"
          {
            echo '=== LIVE DB BASELINE VIA EXISTING HELPER ==='
            if sudo -n -l 2>/dev/null | grep -Fq '/usr/local/sbin/avaya-j129-lab-deploy'; then
              sudo -n /usr/local/sbin/avaya-j129-lab-deploy inspect-db || true
            else
              echo 'WARN: helper DB no autorizado.'
            fi
          } | tee -a "$REPORT"

      - name: Intentar consulta live Grandstream sin exponer credenciales
        shell: bash
        env:
          PREFIX: ${{ inputs.mac_prefix }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/grandstream-db-oui-audit.txt"
          PREFIX_NORM="$(printf '%s' "$PREFIX" | tr '[:lower:]' '[:upper:]')"
          MODEL_NORM="$(printf '%s' "$MODEL" | tr -d ' ' | tr '[:lower:]' '[:upper:]')"
          {
            echo '=== LIVE GRANDSTREAM DB QUERY ==='
            if [ -r /etc/amportal.conf ] && command -v mysql >/dev/null 2>&1; then
              DBUSER="$(sed -n 's/^AMPDBUSER=//p' /etc/amportal.conf | head -n1)"
              DBPASS="$(sed -n 's/^AMPDBPASS=//p' /etc/amportal.conf | head -n1)"
              DBHOST="$(sed -n 's/^AMPDBHOST=//p' /etc/amportal.conf | head -n1)"
              [ -n "$DBHOST" ] || DBHOST=localhost
              CNF="$(mktemp "$RUNNER_TEMP/grandstream-db.XXXXXX.cnf")"
              chmod 600 "$CNF"
              trap 'rm -f "$CNF"' EXIT
              {
                echo '[client]'
                printf 'user=%s\n' "$DBUSER"
                printf 'password=%s\n' "$DBPASS"
                printf 'host=%s\n' "$DBHOST"
              } > "$CNF"
              mysql --defaults-extra-file="$CNF" --batch --raw endpointconfig <<SQL
SET SESSION TRANSACTION READ ONLY;
SELECT '=== GRANDSTREAM MANUFACTURER ===';
SELECT id,name,description FROM manufacturer WHERE name='Grandstream';
SELECT '=== GRANDSTREAM MODEL ===';
SELECT m.id,m.id_manufacturer,m.name,m.description,m.max_accounts,m.static_ip_supported,m.dynamic_ip_supported,m.static_prov_supported
FROM model m JOIN manufacturer mf ON mf.id=m.id_manufacturer
WHERE mf.name='Grandstream' AND UPPER(REPLACE(m.name,' ',''))='${MODEL_NORM}';
SELECT '=== GRANDSTREAM MODEL PROPERTIES ===';
SELECT mp.id,mp.property_key,CASE WHEN LOWER(mp.property_key) LIKE '%password%' THEN '***OCULTO***' ELSE mp.property_value END AS property_value
FROM model_properties mp JOIN model m ON m.id=mp.id_model JOIN manufacturer mf ON mf.id=m.id_manufacturer
WHERE mf.name='Grandstream' AND UPPER(REPLACE(m.name,' ',''))='${MODEL_NORM}' ORDER BY mp.property_key,mp.id;
SELECT '=== ALL GRANDSTREAM MAC PREFIXES ===';
SELECT mp.id,mp.id_manufacturer,mp.mac_prefix,mp.description,mf.name AS manufacturer
FROM mac_prefix mp JOIN manufacturer mf ON mf.id=mp.id_manufacturer WHERE mf.name='Grandstream' ORDER BY mp.mac_prefix;
SELECT '=== REQUESTED PREFIX LOOKUP ===';
SELECT mp.id,mp.id_manufacturer,mp.mac_prefix,mp.description,mf.name AS manufacturer
FROM mac_prefix mp LEFT JOIN manufacturer mf ON mf.id=mp.id_manufacturer WHERE UPPER(mp.mac_prefix)='${PREFIX_NORM}';
ROLLBACK;
SQL
              rm -f "$CNF"
              trap - EXIT
              echo 'LIVE-GRANDSTREAM-DB-QUERY-PASS'
            else
              echo 'LIVE-GRANDSTREAM-DB-QUERY=UNAVAILABLE'
              echo 'NOTE: el runner no puede leer /etc/amportal.conf directamente; se requiere ampliar el helper read-only para consulta live genérica.'
            fi
          } | tee -a "$REPORT"

      - name: Auditar definición stock instalada y del repositorio
        shell: bash
        env:
          PREFIX: ${{ inputs.mac_prefix }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/grandstream-db-oui-audit.txt"
          MODEL_NORM="$(printf '%s' "$MODEL" | tr -d ' ')"
          {
            echo '=== STOCK ENDPOINTCONFIG SQL EVIDENCE ==='
            for root in \
              /usr/share/issabel/module_installer/issabel-endpointconfig2-5.0.0-1.el8/setup/db \
              usr/share/issabel/module_installer/issabel-endpointconfig2-5.0.0-1.el8/setup/db; do
              [ -d "$root" ] || continue
              echo "--- root=$root ---"
              grep -RniF 'Grandstream' "$root" 2>/dev/null | head -n 120 || true
              echo "--- model=$MODEL_NORM ---"
              grep -RniF "$MODEL_NORM" "$root" 2>/dev/null | head -n 80 || true
              echo "--- prefix=$PREFIX ---"
              grep -RniFi "$PREFIX" "$root" 2>/dev/null | head -n 80 || true
            done
          } | tee -a "$REPORT"

      - name: Generar resumen visible
        if: always()
        shell: bash
        env:
          PREFIX: ${{ inputs.mac_prefix }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/grandstream-db-oui-audit.txt"
          LIVE='NO'
          grep -Fq 'LIVE-GRANDSTREAM-DB-QUERY-PASS' "$REPORT" && LIVE='SI'
          PREFIX_FOUND='NO'
          grep -Eqi "${PREFIX//:/[:]}" "$REPORT" && PREFIX_FOUND='SI'
          {
            echo '## Grandstream DB & OUI Audit'
            echo
            echo '| Campo | Valor |'
            echo '|---|---|'
            echo "| Modelo buscado | \`$MODEL\` |"
            echo "| OUI buscado | \`$PREFIX\` |"
            echo "| Consulta live genérica disponible | \`$LIVE\` |"
            echo "| Evidencia del prefijo en salida | \`$PREFIX_FOUND\` |"
            echo
            echo '> Revise el artifact para manufacturer_id, model_id, propiedades y todos los prefijos encontrados. La auditoría no modifica la DB.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grandstream-db-oui-${{ github.run_id }}
          path: ${{ runner.temp }}/grandstream-db-oui-audit.txt
          if-no-files-found: error
          retention-days: 30

      - name: Resultado
        shell: bash
        run: |
          echo 'GRANDSTREAM-DB-OUI-AUDIT-COMPLETE'
