name: G-TMP-02 | Issabel Lab | Grandstream DB OUI | Read-Only Audit

on:
  workflow_dispatch:
    inputs:
      mac_prefix:
        description: OUI o prefijo MAC a buscar
        required: true
        default: C0:74:AD
        type: string
      model:
        description: Modelo Grandstream a verificar
        required: true
        default: GXP1625
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Grandstream DB OUI Audit
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = "github-runner"

      - name: Run read-only Grandstream DB OUI audit
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/grandstream-db-oui-audit.sh "${{ inputs.mac_prefix }}" "${{ inputs.model }}" "$RUNNER_TEMP/grandstream-db-oui-audit.txt"

      - name: Job summary
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/grandstream-db-oui-audit.txt"
          LIVE=NO
          PREFIX=NO
          [ -f "$REPORT" ] && grep -Fq 'LIVE-GRANDSTREAM-DB-QUERY-PASS' "$REPORT" && LIVE=YES || true
          [ -f "$REPORT" ] && grep -Fqi '${{ inputs.mac_prefix }}' "$REPORT" && PREFIX=YES || true
          {
            echo '## Grandstream DB OUI Audit'
            echo
            echo '| Field | Value |'
            echo '|---|---|'
            echo '| Model | `${{ inputs.model }}` |'
            echo '| OUI | `${{ inputs.mac_prefix }}` |'
            echo "| Live DB query | \`$LIVE\` |"
            echo "| Prefix evidence | \`$PREFIX\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grandstream-db-oui-${{ github.run_id }}
          path: ${{ runner.temp }}/grandstream-db-oui-audit.txt
          if-no-files-found: warn
          retention-days: 30
