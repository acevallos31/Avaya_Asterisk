name: G-TMP-02 | Issabel Lab | Grandstream DB OUI | Read-Only Audit

on:
  workflow_dispatch:
    inputs:
      mac_prefix:
        description: OUI o prefijo MAC a buscar
        required: true
        default: C0:74:AD
        type: string
      model:
        description: Modelo Grandstream a verificar
        required: true
        default: GXP1625
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Grandstream DB OUI Audit
    runs-on: [self-hosted, Linux, X64, issabel-lab]
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Audit branch and runner
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "Audit"
          test "$(id -un)" = "github-runner"

      - name: Sync restricted helper
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/sbin/avaya-j129-helper-sync
          sudo -n -l | grep -F '/usr/local/sbin/avaya-j129-helper-sync'
          sudo -n /usr/local/sbin/avaya-j129-helper-sync
          sudo -n -l | grep -F '/usr/local/sbin/avaya-j129-lab-deploy'

      - name: Query live endpointconfig DB read-only
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/grandstream-db-oui-audit.txt"
          sudo -n /usr/local/sbin/avaya-j129-lab-deploy inspect-manufacturer Grandstream "${{ inputs.model }}" "${{ inputs.mac_prefix }}" | tee "$REPORT"

      - name: Job summary
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/grandstream-db-oui-audit.txt"
          LIVE=NO
          PREFIX=NO
          MODEL=NO
          MANUFACTURER_ID='N/D'
          MODEL_ID='N/D'
          if [ -f "$REPORT" ]; then
            grep -Fq 'MANUFACTURER-DB-READONLY-PASS' "$REPORT" && LIVE=YES || true
            grep -Fqi $'\t${{ inputs.mac_prefix }}\t' "$REPORT" && PREFIX=YES || true
            grep -Fqi $'\t${{ inputs.model }}\t' "$REPORT" && MODEL=YES || true
            MANUFACTURER_ID="$(awk '/=== MANUFACTURER ===/{f=1;next}/=== MODELS ===/{f=0} f && $1 ~ /^[0-9]+$/ {print $1; exit}' "$REPORT")"
            MODEL_ID="$(awk '/=== MODELS ===/{f=1;next}/=== MODEL PROPERTIES ===/{f=0} f && $1 ~ /^[0-9]+$/ {print $1; exit}' "$REPORT")"
            [ -n "$MANUFACTURER_ID" ] || MANUFACTURER_ID='N/D'
            [ -n "$MODEL_ID" ] || MODEL_ID='N/D'
          fi
          {
            echo '## Grandstream DB OUI Audit'
            echo
            echo '| Field | Value |'
            echo '|---|---|'
            echo '| Manufacturer | `Grandstream` |'
            echo "| Manufacturer ID | \`$MANUFACTURER_ID\` |"
            echo '| Model requested | `${{ inputs.model }}` |'
            echo "| Model ID | \`$MODEL_ID\` |"
            echo '| OUI requested | `${{ inputs.mac_prefix }}` |'
            echo "| Live DB query | \`$LIVE\` |"
            echo "| Model present in live DB | \`$MODEL\` |"
            echo "| Requested OUI present in live DB | \`$PREFIX\` |"
            echo
            echo '> Consulta ejecutada mediante helper restringido y transacción READ ONLY. No se muestran credenciales.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grandstream-db-oui-${{ github.run_id }}
          path: ${{ runner.temp }}/grandstream-db-oui-audit.txt
          if-no-files-found: warn
          retention-days: 30
