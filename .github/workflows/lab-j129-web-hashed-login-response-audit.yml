name: Issabel Lab J129 Web Hashed Login Response Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Auditar respuesta del login web hash J129
    runs-on: [self-hosted, linux, x64]
    env:
      J129_WEB_USER: admin
      J129_WEB_PASSWORD: ${{ secrets.J129_WEB_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verificar identidad del runner
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(id -un)@$(hostname)"
          test "$(id -un)" = "github-runner"
          test "$(hostname -s)" = "issabel"
          test "${GITHUB_REF_NAME}" = "Audit"

      - name: Validar secreto
        shell: bash
        run: |
          set -euo pipefail
          test -n "${J129_WEB_PASSWORD:-}" || { echo "ERROR: falta J129_WEB_PASSWORD"; exit 2; }
          echo 'J129-WEB-SECRET-PRESENT'

      - name: Ejecutar auditoria sanitizada del login hash
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${J129_WEB_PASSWORD}"
          python3 tests/lab/j129_web_hashed_login_response_audit.py
