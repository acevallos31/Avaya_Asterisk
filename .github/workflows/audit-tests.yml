name: Avaya Issabel Audit Tests

on:
  push:
    branches: [Audit]
  pull_request:
    branches: [main, Audit]

permissions:
  contents: read

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository audit contracts
        run: python -m unittest discover -s tests -p "test_*.py" -v
