# LAB: expone solo archivos de provisioning Avaya en la raiz HTTP.
# No publica directorios ni otros archivos de /tftpboot.

AliasMatch "^/(46xxsettings\.txt|J100Supgrade\.txt|[0-9A-Fa-f]{12}\.txt)$" "/tftpboot/$1"

<Directory "/tftpboot">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
